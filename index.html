<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loomi Messenger 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --green: #25D366; --bg: #0b141a; --dark: #111b21; --panel: #202c33; --light: #e9edef; --my-msg: #005c4b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--light); height: 100vh; display: flex; overflow: hidden; }

        /* Авторизация */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--dark); padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Основная сетка */
        .sidebar { width: 350px; background: var(--dark); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; z-index: 10; }
            .sidebar.hidden { transform: translateX(-100%); }
        }

        /* Контакты */
        .contact { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .contact:hover { background: #2a3942; }

        /* Сообщения */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #0b141a; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 85%; position: relative; cursor: pointer; font-size: 15px; word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 2px; }
        .msg.deleted { opacity: 0.6; font-style: italic; background: none !important; border: 1px solid #444; }

        /* Меню удаления */
        .del-menu { position: fixed; background: #374045; border-radius: 8px; overflow: hidden; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .del-menu button { display: block; width: 100%; padding: 12px 20px; border: none; background: none; color: white; cursor: pointer; text-align: left; border-bottom: 1px solid #444; }
        .del-menu button:hover { background: #4a555c; }

        /* Поле ввода */
        .inp { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2a3942; color: white; outline: none; }
        .footer { padding: 10px; background: var(--panel); display: flex; gap: 10px; align-items: center; }

        /* Экран звонка */
        #call-screen { position: fixed; inset: 0; background: #000; z-index: 11000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #remoteVid { width: 100%; height: 100%; object-fit: cover; }
        #localVid { width: 100px; height: 140px; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid white; object-fit: cover; }
        .call-tools { position: absolute; bottom: 50px; display: flex; gap: 20px; }
        .c-btn { width: 65px; height: 65px; border-radius: 50%; border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<audio id="ringtone" loop src="https://www.soundjay.com/phone/phone-calling-1.mp3"></audio>
<audio id="remoteAudio" autoplay></audio>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="color: var(--green); margin-bottom: 20px;">Loomi Messenger</h2>
        <input type="text" id="a-name" class="inp" style="margin-bottom:10px" placeholder="Логин">
        <input type="password" id="a-pass" class="inp" style="margin-bottom:15px" placeholder="Пароль">
        <button class="btn-main" style="width:100%; padding:12px; background:var(--green); border:none; border-radius:10px; font-weight:bold;" onclick="login()">ВОЙТИ</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div style="padding: 20px; background: var(--panel); display: flex; justify-content: space-between; align-items: center;">
        <b id="my-name-display">...</b>
        <button onclick="logout()" style="color:#ff3b30; background:none; border:none; cursor:pointer;">Выход</button>
    </div>
    <div style="padding: 10px;"><button class="inp" style="background:var(--green); color:black; font-weight:bold;" onclick="addFriend()">+ Новый контакт</button></div>
    <div id="contactsBox" style="overflow-y: auto; flex: 1;"></div>
</div>

<div class="chat-area">
    <div style="padding: 15px; background: var(--panel); display: flex; align-items: center; gap: 15px;">
        <button onclick="backToList()" id="mobile-back" style="display:none; background:none; border:none; color:white; font-size:24px;">←</button>
        <h4 id="chat-title">Выберите чат</h4>
        <div id="call-btns" style="display:none; margin-left: auto; gap: 20px;">
            <span onclick="makeCall(true)" style="cursor:pointer; font-size:22px;">📹</span>
            <span onclick="makeCall(false)" style="cursor:pointer; font-size:22px;">📞</span>
        </div>
    </div>
    <div id="messages"></div>
    <form class="footer" onsubmit="sendMsg(event)">
        <button type="button" id="voice-btn" onclick="toggleVoice()" style="background:none; border:none; font-size:24px; cursor:pointer;">🎤</button>
        <input type="text" id="m-inp" class="inp" placeholder="Сообщение..." disabled>
        <button type="submit" style="background:none; border:none; font-size:26px; cursor:pointer;">🚀</button>
    </form>
</div>

<div id="call-screen">
    <video id="remoteVid" autoplay playsinline></video>
    <video id="localVid" autoplay muted playsinline></video>
    <div class="call-tools">
        <button id="btn-accept" class="c-btn" style="background: var(--green);" onclick="answerCall()">📞</button>
        <button class="c-btn" style="background: #ff3b30;" onclick="endCall()">🛑</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, peer, localStream, currentCall, mediaRec, audioChunks = [];

    // --- АВТО-ВХОД ---
    window.onload = () => {
        const saved = localStorage.getItem('loomi_auth');
        if(saved) {
            const u = JSON.parse(saved);
            document.getElementById('a-name').value = u.name;
            document.getElementById('a-pass').value = u.pass;
            login();
        }
        if (Notification.permission === "default") Notification.requestPermission();
    };

    async function login() {
        const name = document.getElementById('a-name').value.trim().toLowerCase();
        const pass = document.getElementById('a-pass').value.trim();
        if(!name || !pass) return;

        const snap = await db.ref(`users/${name}`).once('value');
        if(snap.exists() && snap.val().pass !== pass) return alert("Неверный пароль");

        if(!snap.exists()) await db.ref(`users/${name}`).set({pass});
        
        myName = name;
        localStorage.setItem('loomi_auth', JSON.stringify({name, pass}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = "Я: " + myName;

        initPeer(); loadContacts(); listenSignals();
    }

    function logout() { localStorage.removeItem('loomi_auth'); location.reload(); }

    // --- ПИРИНГ И ЗВОНКИ ---
    function initPeer() {
        peer = new Peer(myName, { config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]} });
        peer.on('call', call => {
            currentCall = call;
            call.on('stream', stream => {
                document.getElementById('remoteVid').srcObject = stream;
                document.getElementById('remoteAudio').srcObject = stream;
            });
        });
    }

    async function makeCall(video) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') await ctx.resume();

            localStream = await navigator.mediaDevices.getUserMedia({video, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            db.ref(`calls/${partner}`).set({from: myName, active: true, video});
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'none';

            const call = peer.call(partner, localStream);
            currentCall = call;
            call.on('stream', stream => {
                document.getElementById('remoteVid').srcObject = stream;
                document.getElementById('remoteAudio').srcObject = stream;
            });
        } catch(e) { alert("Ошибка доступа к камере/микрофону"); }
    }

    async function answerCall() {
        document.getElementById('ringtone').pause();
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVid').srcObject = localStream;
        currentCall.answer(localStream);
        document.getElementById('btn-accept').style.display = 'none';
        db.ref(`calls/${myName}`).update({active: false});
    }

    function listenSignals() {
        db.ref(`calls/${myName}`).on('value', snap => {
            const d = snap.val();
            if(d && d.active) {
                document.getElementById('ringtone').play().catch(()=>{});
                document.getElementById('call-screen').style.display = 'flex';
                document.getElementById('btn-accept').style.display = 'flex';
            } else if (!d) { endCall(); }
        });
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        db.ref(`calls/${myName}`).remove();
        if(partner) db.ref(`calls/${partner}`).remove();
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('ringtone').pause();
    }

    // --- ЧАТ И УДАЛЕНИЕ ---
    function selectChat(name) {
        partner = name;
        document.getElementById('chat-title').innerText = name;
        document.getElementById('call-btns').style.display = 'flex';
        document.getElementById('m-inp').disabled = false;
        if(window.innerWidth < 768) {
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('mobile-back').style.display = 'block';
        }

        const chatID = [myName, partner].sort().join("_");
        db.ref(`chats/${chatID}`).on('value', snap => {
            const box = document.getElementById('messages'); box.innerHTML = '';
            snap.forEach(child => {
                const m = child.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === myName ? 'mine' : 'others'} ${m.deleted ? 'deleted' : ''}`;
                
                if (m.deleted) {
                    div.innerText = "🚫 Сообщение удалено";
                } else if (m.audio) {
                    div.innerHTML = `<audio controls src="${m.audio}" style="width:200px; height:35px;"></audio>`;
                } else {
                    div.innerText = m.text;
                }
                
                div.oncontextmenu = (e) => { e.preventDefault(); showDelMenu(e, child.key, m.from === myName); };
                div.onclick = (e) => showDelMenu(e, child.key, m.from === myName);
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function showDelMenu(e, msgKey, isMine) {
        const exist = document.querySelector('.del-menu'); if(exist) exist.remove();
        const menu = document.createElement('div');
        menu.className = 'del-menu';
        menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
        
        let html = `<button onclick="deleteMsg('${msgKey}', 'me')">Удалить у меня</button>`;
        if(isMine) html += `<button onclick="deleteMsg('${msgKey}', 'all')">Удалить для всех</button>`;
        
        menu.innerHTML = html;
        document.body.appendChild(menu);
        setTimeout(() => window.onclick = () => menu.remove(), 100);
    }

    function deleteMsg(key, mode) {
        const id = [myName, partner].sort().join("_");
        if(mode === 'all') db.ref(`chats/${id}/${key}`).update({deleted: true, text: "", audio: null});
        else db.ref(`chats/${id}/${key}`).remove();
    }

    // --- ГОЛОСОВЫЕ ---
    async function toggleVoice() {
        const btn = document.getElementById('voice-btn');
        if (!mediaRec) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(stream);
                audioChunks = [];
                mediaRec.ondataavailable = e => audioChunks.push(e.data);
                mediaRec.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    reader.onloadend = () => {
                        const id = [myName, partner].sort().join("_");
                        db.ref(`chats/${id}`).push({from: myName, audio: reader.result, deleted: false});
                    };
                    stream.getTracks().forEach(t => t.stop()); mediaRec = null;
                };
                mediaRec.start(); btn.innerText = '🛑'; btn.style.color = 'red';
            } catch (e) { alert("Микрофон не доступен"); }
        } else {
            mediaRec.stop(); btn.innerText = '🎤'; btn.style.color = 'white';
        }
    }

    function sendMsg(e) {
        e.preventDefault(); const i = document.getElementById('m-inp');
        if(!i.value) return;
        const id = [myName, partner].sort().join("_");
        db.ref(`chats/${id}`).push({from: myName, text: i.value, deleted: false});
        i.value = '';
    }

    function backToList() { document.getElementById('sidebar').classList.remove('hidden'); document.getElementById('mobile-back').style.display = 'none'; }
    function addFriend() { const f = prompt("Имя контакта:"); if(f) db.ref(`users/${myName}/friends/${f.toLowerCase()}`).set(true); }
    function loadContacts() {
        db.ref(`users/${myName}/friends`).on('value', snap => {
            const b = document.getElementById('contactsBox'); b.innerHTML = '';
            Object.keys(snap.val() || {}).forEach(name => {
                const d = document.createElement('div'); d.className = 'contact';
                d.innerHTML = `👤 ${name}`; d.onclick = () => selectChat(name); b.appendChild(d);
            });
        });
    }
</script>
</body>
</html>
