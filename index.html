<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loomi 2026 Pro Max</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --green: #00a884; --bg: #0b141a; --dark: #111b21; --panel: #202c33; 
            --my-msg: #005c4b; --others-msg: #202c33; --accent: #e1b12c; 
            --text: #e9edef; --blue-tick: #53bdeb; --danger: #ff4b4b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; display: flex; }

        /* AUTH SCREEN */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .auth-card { background: var(--dark); padding: 40px; border-radius: 24px; width: 360px; text-align: center; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .auth-card h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(to right, var(--green), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* CALL UI */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v { position: absolute; width: 120px; height: 160px; bottom: 120px; right: 20px; border: 2px solid var(--green); border-radius: 12px; transition: 0.3s; z-index: 10; }

        /* SIDEBAR */
        .sidebar { width: 380px; background: var(--dark); border-right: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; }
        .header { background: var(--panel); padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 65px; z-index: 100; }
        .user-av { width: 40px; height: 40px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid var(--green); }
        
        .search-box { padding: 10px; background: var(--dark); }
        .contact-item { padding: 12px 16px; border-bottom: 1px solid #1c262d; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .contact-item:hover { background: #2a3942; }
        .contact-info { flex: 1; overflow: hidden; }
        .contact-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--green); color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }

        /* MESSAGE STYLES */
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 70%; position: relative; font-size: 15px; animation: slideIn 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.mine { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--others-msg); border-top-left-radius: 2px; }
        
        .reply-box { background: rgba(0,0,0,0.1); border-left: 4px solid var(--accent); padding: 4px 8px; margin-bottom: 5px; border-radius: 4px; font-size: 13px; }
        .msg-meta { font-size: 10px; opacity: 0.6; display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
        
        .msg-actions { position: absolute; top: 0; right: -30px; display: none; flex-direction: column; gap: 5px; }
        .msg:hover .msg-actions { display: flex; }
        .action-btn { font-size: 12px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .action-btn:hover { opacity: 1; color: var(--danger); }

        /* INPUT AREA */
        #reply-preview { background: var(--panel); padding: 8px 16px; border-top: 1px solid #333; display: none; align-items: center; justify-content: space-between; }
        .footer { background: var(--panel); padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
        .inp-wrap { flex: 1; background: #2a3942; border-radius: 25px; display: flex; align-items: center; padding: 2px 15px; }
        .inp { flex: 1; background: none; border: none; padding: 10px 0; color: white; outline: none; font-size: 15px; }
        .btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #8696a0; display: flex; align-items: center; justify-content: center; }
        
        video, img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: zoom-in; }
        audio { height: 35px; margin-top: 5px; filter: invert(0.1) hue-rotate(180deg); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<audio id="notif-sound" src="https://www.soundjay.com/buttons/beep-07a.mp3"></audio>

<div id="auth-screen">
    <div class="auth-card">
        <h1>Loomi</h1>
        <p style="margin-bottom: 20px; opacity: 0.7;">Secure Messaging 2026</p>
        <input type="text" id="a-name" class="inp" style="width:100%; background:#2a3942; border-radius:10px; margin-bottom:10px" placeholder="Логин">
        <input type="password" id="a-pass" class="inp" style="width:100%; background:#2a3942; border-radius:10px; margin-bottom:10px" placeholder="Пароль">
        <button onclick="login()" style="width:100%; margin-top:15px; padding:14px; background:var(--green); color:white; border:none; border-radius:12px; cursor:pointer; font-weight:bold; font-size:16px;">ВОЙТИ</button>
    </div>
</div>

<div id="call-ui">
    <div style="position:absolute; top:40px; text-align:center; z-index:5">
        <h2 id="call-partner-name">...</h2>
        <p id="call-timer">00:00</p>
    </div>
    <video id="remote-v" autoplay playsinline></video>
    <video id="local-v" autoplay playsinline muted></video>
    <div style="position:absolute; bottom:40px; display:flex; gap:20px;">
        <button onclick="toggleCallMute()" class="btn" style="background:#444; padding:15px; border-radius:50%">🔇</button>
        <button onclick="endCall()" style="padding:15px 40px; background:var(--danger); color:white; border-radius:35px; border:none; cursor:pointer; font-weight:bold; font-size:18px;">ЗАВЕРШИТЬ</button>
    </div>
</div>

<div class="sidebar">
    <div class="header">
        <div class="user-av" id="my-av">?</div>
        <div style="flex:1">
            <b id="my-name-display" style="color:var(--green)">ЗАГРУЗКА...</b>
            <div style="font-size:11px; opacity:0.6;">Ваш статус: Онлайн</div>
        </div>
        <button onclick="logout()" class="btn" style="font-size:16px">🚪</button>
    </div>
    <div class="search-box">
        <div style="display:flex; gap:5px;">
            <button onclick="addChat(false)" class="inp" style="background:var(--green); cursor:pointer; font-size:13px;">+ КОНТАКТ</button>
            <button onclick="addChat(true)" class="inp" style="background:var(--accent); cursor:pointer; font-size:13px;">+ ГРУППА</button>
        </div>
    </div>
    <div id="contactsList" style="flex:1; overflow-y:auto;"></div>
</div>

<div class="chat-area">
    <div class="header" id="chat-header" style="display:none; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
        <div class="user-av" id="partner-av">?</div>
        <div style="flex:1">
            <b id="p-name" style="font-size:16px;">ВЫБЕРИТЕ ЧАТ</b>
            <div id="p-status" style="font-size:12px; color:var(--green); transition:0.3s;">...</div>
        </div>
        <div style="display:flex; gap:15px;">
            <button onclick="startCall()" class="btn">📞</button>
            <button onclick="alert('Очистка истории')" class="btn">🗑️</button>
        </div>
    </div>

    <div id="messages"></div>

    <div id="reply-preview">
        <div style="border-left:3px solid var(--accent); padding-left:10px;">
            <small id="reply-user" style="color:var(--accent); font-weight:bold;"></small>
            <div id="reply-text" style="font-size:12px; opacity:0.8; max-height:30px; overflow:hidden;"></div>
        </div>
        <button onclick="cancelReply()" class="btn" style="font-size:16px;">✖</button>
    </div>

    <form class="footer" onsubmit="handleSend(event)">
        <label class="btn">➕<input type="file" id="file-input" hidden onchange="uploadFile(this)"></label>
        <div class="inp-wrap">
            <input type="text" id="m-inp" class="inp" placeholder="Введите сообщение..." oninput="handleTyping()" disabled autocomplete="off">
            <button type="button" class="btn" onclick="toggleEmoji()">😊</button>
        </div>
        <button type="button" id="mic-btn" class="btn" onclick="toggleMic()">🎤</button>
        <button type="submit" class="btn" style="color:var(--green); font-size:28px;">🚀</button>
    </form>
</div>

<script>
    // Инициализация Firebase (конфиг из вашего примера)
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, chatId, isGroup, isSending = false, tTimeout, mediaRec, audioChunks = [], pc, localStream;
    let replyData = null;

    // --- АВТОРИЗАЦИЯ И ПРОФИЛЬ ---
    async function login() {
        const n = document.getElementById('a-name').value.trim().toLowerCase();
        const p = document.getElementById('a-pass').value.trim();
        if(!n || !p) return;
        const snap = await db.ref(`users/${n}`).once('value');
        if(snap.exists() && snap.val().pass !== p) return alert("Неверные данные");
        if(!snap.exists()) await db.ref(`users/${n}`).set({pass:p, joined: Date.now()});
        
        myName = n;
        localStorage.setItem('loomi_auth', JSON.stringify({n, p}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = myName.toUpperCase();
        document.getElementById('my-av').innerText = myName[0].toUpperCase();
        
        db.ref(`status/${myName}`).set(true);
        db.ref(`status/${myName}`).onDisconnect().remove();
        
        loadContacts();
        listenForCalls();
    }

    // --- КОНТАКТЫ С ИНДИКАТОРАМИ ---
    function loadContacts() {
        db.ref(`users/${myName}/chats`).on('value', snap => {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            snap.forEach(c => {
                const name = c.key;
                const isG = c.val().isGroup;
                const d = document.createElement('div');
                d.className = 'contact-item';
                d.id = `item-${name}`;
                d.innerHTML = `
                    <div class="user-av">${name[0].toUpperCase()}</div>
                    <div class="contact-info">
                        <b>${isG ? '👥 ' : ''}${name.toUpperCase()}</b>
                        <small id="stat-${name}" style="color:var(--green)"></small>
                    </div>
                    <div id="unread-${name}" class="unread-badge" style="display:none">0</div>
                `;
                d.onclick = () => openChat(name, isG);
                list.appendChild(d);

                if(!isG) {
                    db.ref(`status/${name}`).on('value', s => {
                        const el = document.getElementById(`stat-${name}`);
                        if(el) el.innerText = s.exists() ? 'онлайн' : 'оффлайн';
                    });
                }
                
                // Счётчик непрочитанных
                const cId = isG ? `group_${name}` : [myName, name].sort().join('_');
                db.ref(`messages/${cId}`).on('value', mSnap => {
                    let unread = 0;
                    mSnap.forEach(m => { if(m.val().from !== myName && !m.val().seen) unread++; });
                    const badge = document.getElementById(`unread-${name}`);
                    if(badge) {
                        badge.innerText = unread;
                        badge.style.display = unread > 0 ? 'block' : 'none';
                    }
                });
            });
        });
    }

    // --- ОСНОВНОЙ ЧАТ ---
    function openChat(name, groupFlag) {
        partner = name; isGroup = groupFlag;
        chatId = isGroup ? `group_${name}` : [myName, partner].sort().join('_');
        
        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('p-name').innerText = partner.toUpperCase();
        document.getElementById('partner-av').innerText = partner[0].toUpperCase();
        document.getElementById('m-inp').disabled = false;
        cancelReply();

        // Сброс старых слушателей
        if(!isGroup) {
            db.ref(`status/${partner}`).off();
            db.ref(`typing/${partner}/${myName}`).off();
            db.ref(`status/${partner}`).on('value', s => {
                document.getElementById('p-status').innerText = s.exists() ? 'в сети' : 'был(а) недавно';
                document.getElementById('p-status').style.color = s.exists() ? 'var(--green)' : '#8696a0';
            });
            db.ref(`typing/${partner}/${myName}`).on('value', s => {
                if(s.val()) document.getElementById('p-status').innerText = 'печатает...';
            });
        }

        db.ref(`messages/${chatId}`).off();
        db.ref(`messages/${chatId}`).on('value', snap => {
            const box = document.getElementById('messages');
            const atBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 150;
            box.innerHTML = '';

            snap.forEach(mSnap => {
                const m = mSnap.val();
                const mKey = mSnap.key;
                
                if(m.from !== myName && !m.seen) db.ref(`messages/${chatId}/${mKey}`).update({seen:true});

                const d = document.createElement('div');
                d.className = `msg ${m.from === myName ? 'mine' : 'others'}`;
                
                let html = '';
                if(m.reply) html += `<div class="reply-box"><b>${m.reply.user}</b><br>${m.reply.text}</div>`;
                
                if(m.file) {
                    if(m.type.includes('image')) html += `<img src="${m.file}" onclick="window.open(this.src)">`;
                    else if(m.type.includes('video')) html += `<video controls src="${m.file}"></video>`;
                    else if(m.type.includes('audio')) html += `<audio controls src="${m.file}"></audio>`;
                }
                
                if(m.text) html += `<div>${parseText(m.text)}</div>`;
                
                const time = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                const ticks = m.from === myName ? `<span style="color:${m.seen? 'var(--blue-tick)':'inherit'}">${m.seen?'✓✓':'✓'}</span>` : '';
                
                html += `<div class="msg-meta">${time} ${ticks}</div>`;
                html += `<div class="msg-actions">
                            <span class="action-btn" onclick="setupReply('${m.from}', '${m.text || 'Медиа'}')">↩</span>
                            ${m.from === myName ? `<span class="action-btn" onclick="deleteMsg('${mKey}')">🗑️</span>` : ''}
                         </div>`;
                
                d.innerHTML = html;
                box.appendChild(d);
            });
            if(atBottom) box.scrollTop = box.scrollHeight;
        });
    }

    // --- ФУНКЦИИ СООБЩЕНИЙ ---
    function handleSend(e) {
        e.preventDefault();
        const inp = document.getElementById('m-inp');
        if(!inp.value.trim() && !isSending) return;
        
        const msg = {
            from: myName,
            text: inp.value,
            time: Date.now(),
            seen: false
        };
        
        if(replyData) {
            msg.reply = replyData;
            cancelReply();
        }

        db.ref(`messages/${chatId}`).push(msg);
        inp.value = '';
        db.ref(`typing/${myName}/${partner}`).remove();
    }

    function setupReply(user, text) {
        replyData = { user, text: text.substring(0, 50) };
        document.getElementById('reply-user').innerText = user.toUpperCase();
        document.getElementById('reply-text').innerText = text;
        document.getElementById('reply-preview').style.display = 'flex';
        document.getElementById('m-inp').focus();
    }

    function cancelReply() {
        replyData = null;
        document.getElementById('reply-preview').style.display = 'none';
    }

    function deleteMsg(key) {
        if(confirm("Удалить сообщение для всех?")) db.ref(`messages/${chatId}/${key}`).remove();
    }

    function parseText(t) {
        return t.replace(/[<>]/g, '').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--blue-tick)">$1</a>');
    }

    // --- МЕДИА И ЗВОНКИ (WebRTC) ---
    async function startCall() {
        document.getElementById('call-ui').style.display = 'flex';
        document.getElementById('call-partner-name').innerText = partner.toUpperCase();
        
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local-v').srcObject = localStream;
        
        pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        
        pc.onicecandidate = e => e.candidate && db.ref(`calls/${partner}/ice`).set(JSON.stringify(e.candidate));
        pc.ontrack = e => document.getElementById('remote-v').srcObject = e.streams[0];
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        db.ref(`calls/${partner}/signal`).set({from:myName, offer: JSON.stringify(offer)});
        
        db.ref(`calls/${myName}/answer`).on('value', s => {
            if(s.val()) pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(s.val())));
        });
    }

    function listenForCalls() {
        db.ref(`calls/${myName}/signal`).on('value', async s => {
            const d = s.val();
            if(d && d.offer) {
                if(confirm("Входящий вызов от " + d.from)) {
                    partner = d.from;
                    document.getElementById('call-ui').style.display = 'flex';
                    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                    document.getElementById('local-v').srcObject = localStream;
                    pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
                    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
                    pc.onicecandidate = e => e.candidate && db.ref(`calls/${partner}/ice`).set(JSON.stringify(e.candidate));
                    pc.ontrack = e => document.getElementById('remote-v').srcObject = e.streams[0];
                    await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.offer)));
                    const ans = await pc.createAnswer();
                    await pc.setLocalDescription(ans);
                    db.ref(`calls/${partner}/answer`).set(JSON.stringify(ans));
                } else {
                    db.ref(`calls/${myName}`).remove();
                }
            }
        });
        db.ref(`calls/${myName}/ice`).on('value', s => {
            if(s.val() && pc) pc.addIceCandidate(new RTCIceCandidate(JSON.parse(s.val())));
        });
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(pc) pc.close();
        db.ref(`calls/${myName}`).remove();
        db.ref(`calls/${partner}`).remove();
        document.getElementById('call-ui').style.display = 'none';
    }

    // --- ВСПОМОГАТЕЛЬНОЕ ---
    function addChat(g) {
        const n = prompt(g ? "Название группы:" : "Логин собеседника:");
        if(n) db.ref(`users/${myName}/chats/${n.toLowerCase()}`).set({isGroup:g});
    }

    function handleTyping() {
        if(!partner || isGroup) return;
        db.ref(`typing/${myName}/${partner}`).set(true);
        clearTimeout(tTimeout);
        tTimeout = setTimeout(() => db.ref(`typing/${myName}/${partner}`).remove(), 2500);
    }

    function logout() {
        localStorage.clear();
        db.ref(`status/${myName}`).remove();
        location.reload();
    }

    window.onload = () => {
        const auth = localStorage.getItem('loomi_auth');
        if(auth) {
            const d = JSON.parse(auth);
            document.getElementById('a-name').value = d.n;
            document.getElementById('a-pass').value = d.p;
            login();
        }
    };
</script>
</body>
</html>
