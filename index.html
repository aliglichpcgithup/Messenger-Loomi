<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loomi Ultimate 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --green: #00a884; --bg: #0b141a; --dark: #111b21; 
            --panel: #202c33; --my-msg: #005c4b; --others-msg: #202c33; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

        body, html { 
            height: 100dvh; width: 100vw; background: var(--bg); color: #e9edef; 
            overflow: hidden; position: fixed; 
        }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--dark); padding: 35px; border-radius: 28px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #333; }

        .app { display: flex; width: 100%; height: 100%; }

        /* Sidebar */
        .sidebar { 
            width: 350px; background: var(--dark); border-right: 1px solid #222; 
            display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0; 
        }
        @media (max-width: 768px) {
            .sidebar { position: absolute; width: 100%; height: 100%; z-index: 500; }
            .sidebar.hidden { transform: translateX(-100%); }
        }

        .contact-item { padding: 15px 20px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .contact-item:active { background: #2a3942; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        /* Chat Area */
        .chat { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background: var(--bg); }
        
        #messages { 
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; 
            background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay; background-color: var(--bg);
        }

        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; position: relative; cursor: pointer; word-wrap: break-word; font-size: 16px; }
        .msg.mine { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--others-msg); border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg.deleted { opacity: 0.5; font-style: italic; background: none !important; border: 1px solid #444; }

        /* Footer */
        .footer { 
            background: var(--panel); padding: 10px; display: flex; align-items: center; gap: 8px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .inp { flex: 1; background: #2a3942; border: none; padding: 12px 16px; border-radius: 25px; color: white; font-size: 16px; outline: none; }
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #8696a0; display: flex; align-items: center; }

        /* Call Screen */
        #call-screen { position: fixed; inset: 0; background: #000; z-index: 20000; display: none; flex-direction: column; }
        #remoteVid { width: 100%; height: 100%; object-fit: cover; }
        #localVid { width: 90px; height: 130px; position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; border-radius: 12px; border: 2px solid white; object-fit: cover; z-index: 10; }
        .call-ui { position: absolute; bottom: 60px; width: 100%; display: flex; justify-content: center; gap: 40px; }
        .c-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 30px; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="ringtone" loop src="https://www.soundjay.com/phone/phone-calling-1.mp3"></audio>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--green); margin-bottom:10px;">Loomi</h1>
        <p style="margin-bottom:20px; opacity:0.6;">Premium Messenger 2026</p>
        <input type="text" id="a-name" class="inp" style="width:100%; margin-bottom:10px;" placeholder="Логин">
        <input type="password" id="a-pass" class="inp" style="width:100%; margin-bottom:20px;" placeholder="Пароль">
        <button onclick="login()" style="width:100%; padding:15px; background:var(--green); border:none; border-radius:30px; color:white; font-weight:bold;">ВОЙТИ</button>
    </div>
</div>

<div class="app">
    <div class="sidebar" id="sidebar">
        <div style="padding: 20px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding-top: calc(20px + env(safe-area-inset-top));">
            <b id="my-name-display">...</b>
            <button onclick="logout()" style="color:#ff4b4b; background:none; border:none; font-weight:bold;">ВЫХОД</button>
        </div>
        <div style="padding:10px;"><button onclick="addFriend()" class="inp" style="width:100%; background:var(--green); color:white;">+ ДОБАВИТЬ КОНТАКТ</button></div>
        <div id="contactsBox" style="flex:1; overflow-y:auto;"></div>
    </div>

    <div class="chat">
        <div style="padding: 10px 15px; background: var(--panel); display: flex; align-items: center; gap: 10px; padding-top: calc(10px + env(safe-area-inset-top));">
            <button onclick="backToList()" id="btn-back" style="display:none; color:white; background:none; border:none; font-size:24px;">←</button>
            <div style="flex:1;">
                <div id="chat-title" style="font-weight:bold;">Выберите чат</div>
                <div id="typing-status" style="font-size:12px; color:var(--green); height:14px;"></div>
            </div>
            <div id="call-btns" style="display:none; gap:15px;">
                <span onclick="makeCall(true)" style="cursor:pointer; font-size:24px;">📹</span>
                <span onclick="makeCall(false)" style="cursor:pointer; font-size:24px;">📞</span>
            </div>
        </div>
        
        <div id="messages"></div>

        <form class="footer" onsubmit="sendMsg(event)">
            <label class="icon-btn">➕<input type="file" id="img-inp" hidden accept="image/*" onchange="sendImg()"></label>
            <button type="button" id="voice-btn" class="icon-btn" onclick="toggleVoice()">🎤</button>
            <input type="text" id="m-inp" class="inp" placeholder="Сообщение" disabled oninput="handleTyping()" autocomplete="off">
            <button type="submit" class="icon-btn" style="color:var(--green)">🚀</button>
        </form>
    </div>
</div>

<div id="call-screen">
    <video id="remoteVid" autoplay playsinline></video>
    <video id="localVid" autoplay muted playsinline></video>
    <div class="call-ui">
        <button id="btn-accept" onclick="answerCall()" style="background:var(--green)" class="c-btn">📞</button>
        <button onclick="endCall()" style="background:#ff3b30;" class="c-btn">🛑</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, peer, localStream, currentCall, mediaRec, audioChunks = [];

    // --- ФУНКЦИИ УПРАВЛЕНИЯ ---
    async function unlockAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        document.getElementById('remoteAudio').play().catch(() => {});
    }

    window.onload = () => {
        const saved = localStorage.getItem('loomi_auth');
        if(saved) {
            const u = JSON.parse(saved);
            document.getElementById('a-name').value = u.name;
            document.getElementById('a-pass').value = u.pass;
            login();
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = window.visualViewport.height + 'px';
                const msgBox = document.getElementById('messages');
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }
    };

    async function login() {
        const name = document.getElementById('a-name').value.trim().toLowerCase();
        const pass = document.getElementById('a-pass').value.trim();
        if(!name || !pass) return;
        const snap = await db.ref(`users/${name}`).once('value');
        if(snap.exists() && snap.val().pass !== pass) return alert("Ошибка!");
        if(!snap.exists()) await db.ref(`users/${name}`).set({pass});
        
        myName = name;
        localStorage.setItem('loomi_auth', JSON.stringify({name, pass}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = myName;

        db.ref(`status/${myName}`).set(true);
        db.ref(`status/${myName}`).onDisconnect().remove();

        initPeer(); loadContacts(); listenSignals();
    }

    function logout() { db.ref(`status/${myName}`).remove(); localStorage.removeItem('loomi_auth'); location.reload(); }

    function initPeer() {
        peer = new Peer(myName, { config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]} });
        peer.on('call', call => {
            currentCall = call;
            call.on('stream', s => {
                document.getElementById('remoteAudio').srcObject = s;
                document.getElementById('remoteVid').srcObject = s;
            });
        });
    }

    // --- ЗВОНКИ ---
    async function makeCall(video) {
        await unlockAudio();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            db.ref(`calls/${partner}`).set({from: myName, active: true, video});
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'none';
            const call = peer.call(partner, localStream);
            currentCall = call;
            call.on('stream', s => {
                document.getElementById('remoteAudio').srcObject = s;
                document.getElementById('remoteVid').srcObject = s;
            });
        } catch(e) { alert("Включите доступ к медиа!"); }
    }

    async function answerCall() {
        await unlockAudio();
        document.getElementById('ringtone').pause();
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVid').srcObject = localStream;
        currentCall.answer(localStream);
        document.getElementById('btn-accept').style.display = 'none';
        db.ref(`calls/${myName}`).update({active: false});
    }

    function listenSignals() {
        db.ref(`calls/${myName}`).on('value', snap => {
            const d = snap.val();
            if(d && d.active) {
                document.getElementById('ringtone').play().catch(()=>{});
                document.getElementById('call-screen').style.display = 'flex';
                document.getElementById('btn-accept').style.display = 'flex';
            } else if (!d) { endCall(); }
        });
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        db.ref(`calls/${myName}`).remove();
        if(partner) db.ref(`calls/${partner}`).remove();
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('ringtone').pause();
    }

    // --- ЧАТ И УДАЛЕНИЕ ---
    function selectChat(name) {
        partner = name;
        document.getElementById('chat-title').innerText = name.toUpperCase();
        document.getElementById('call-btns').style.display = 'flex';
        document.getElementById('m-inp').disabled = false;
        if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('hidden'); document.getElementById('btn-back').style.display = 'block'; }
        
        const id = [myName, partner].sort().join("_");
        db.ref(`chats/${id}`).off();
        db.ref(`chats/${id}`).on('value', snap => {
            const box = document.getElementById('messages'); box.innerHTML = '';
            snap.forEach(child => {
                const m = child.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === myName ? 'mine' : 'others'} ${m.deleted ? 'deleted' : ''}`;
                
                if (m.deleted) div.innerText = "🚫 Удалено";
                else if (m.img) div.innerHTML = `<img src="${m.img}">`;
                else if (m.audio) div.innerHTML = `<audio controls src="${m.audio}" style="width:200px; height:40px;"></audio>`;
                else div.innerText = m.text;
                
                div.onclick = () => { 
                    if(confirm(m.from === myName ? "Удалить для всех?" : "Удалить у себя?")) deleteMsg(child.key, m.from === myName); 
                };
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });

        db.ref(`typing/${partner}/${myName}`).on('value', s => {
            document.getElementById('typing-status').innerText = s.val() ? 'печатает...' : '';
        });
    }

    function deleteMsg(key, isMine) {
        const id = [myName, partner].sort().join("_");
        if(isMine) db.ref(`chats/${id}/${key}`).update({deleted: true, audio: null, text: "", img: null});
        else db.ref(`chats/${id}/${key}`).remove();
    }

    function handleTyping() {
        db.ref(`typing/${myName}/${partner}`).set(true);
        clearTimeout(window.tT);
        window.tT = setTimeout(() => db.ref(`typing/${myName}/${partner}`).set(false), 2000);
    }

    // --- ОТПРАВКА ---
    function sendImg() {
        const file = document.getElementById('img-inp').files[0];
        const r = new FileReader();
        r.onloadend = () => {
            const id = [myName, partner].sort().join("_");
            db.ref(`chats/${id}`).push({from: myName, img: r.result, deleted: false});
        };
        if(file) r.readAsDataURL(file);
    }

    function sendMsg(e) {
        e.preventDefault(); 
        const i = document.getElementById('m-inp');
        if(!i.value.trim()) return;
        const id = [myName, partner].sort().join("_");
        db.ref(`chats/${id}`).push({from: myName, text: i.value, deleted: false});
        i.value = '';
        i.blur(); // АВТО-СКРЫТИЕ КЛАВИАТУРЫ
    }

    async function toggleVoice() {
        const btn = document.getElementById('voice-btn');
        if (!mediaRec) {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(s); audioChunks = [];
                mediaRec.ondataavailable = e => audioChunks.push(e.data);
                mediaRec.onstop = () => {
                    const r = new FileReader();
                    r.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    r.onloadend = () => {
                        const id = [myName, partner].sort().join("_");
                        db.ref(`chats/${id}`).push({from: myName, audio: r.result, deleted: false});
                    };
                    s.getTracks().forEach(t => t.stop()); mediaRec = null;
                };
                mediaRec.start(); btn.innerText = '🛑'; btn.style.color = 'red';
            } catch (e) { alert("Микрофон заблокирован!"); }
        } else { mediaRec.stop(); btn.innerText = '🎤'; btn.style.color = '#8696a0'; }
    }

    function backToList() { document.getElementById('sidebar').classList.remove('hidden'); document.getElementById('btn-back').style.display = 'none'; }
    function addFriend() { const f = prompt("Логин контакта:"); if(f) db.ref(`users/${myName}/friends/${f.toLowerCase()}`).set(true); }
    
    function loadContacts() {
        db.ref(`users/${myName}/friends`).on('value', snap => {
            const b = document.getElementById('contactsBox'); b.innerHTML = '';
            Object.keys(snap.val() || {}).forEach(name => {
                const d = document.createElement('div'); d.className = 'contact-item';
                d.innerHTML = `<div id="dot-${name}" class="dot"></div> <div style="font-weight:bold;">${name.toUpperCase()}</div>`;
                d.onclick = () => selectChat(name); b.appendChild(d);
                db.ref(`status/${name}`).on('value', s => {
                    const dot = document.getElementById(`dot-${name}`);
                    if(dot) s.exists() ? dot.classList.add('online') : dot.classList.remove('online');
                });
            });
        });
    }
</script>
</body>
</html>
