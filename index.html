<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger with Video Calls</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        #contacts { width: 30%; border-right: 1px solid #ccc; overflow-y: auto; background: white; }
        #chat { width: 70%; display: flex; flex-direction: column; }
        .contact { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.3s; }
        .contact:hover { background: #e7f3ff; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 70%; word-wrap: break-word; }
        .my-msg { background: #0084ff; color: white; align-self: flex-end; }
        .p-msg { background: #e4e6eb; color: black; align-self: flex-start; }
        #input-area { padding: 15px; display: flex; background: white; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        
        /* Экран звонка */
        #call-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 1000;
        }
        video { width: 80%; max-width: 600px; border-radius: 10px; background: #222; }
        #localVid { width: 150px; position: absolute; bottom: 20px; right: 20px; border: 2px solid white; }
        .call-btns { margin-top: 20px; display: flex; gap: 20px; }
        button { padding: 10px 20px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .btn-hangup { background: #ff4444; color: white; }
        .btn-accept { background: #00c851; color: white; display: none; }
    </style>
</head>
<body>

<div id="contacts"></div>
<div id="chat">
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button onclick="sendMessage()">Send</button>
        <button onclick="startCallProcess(true)" style="margin-left:5px;">Video</button>
        <button onclick="startCallProcess(false)" style="margin-left:5px;">Audio</button>
    </div>
</div>

<div id="call-screen">
    <h2 id="call-status" style="color:white;">Звонок...</h2>
    <video id="remoteVid" autoplay playsinline></video>
    <video id="localVid" autoplay playsinline muted></video>
    <div class="call-btns">
        <button class="btn-accept" id="btn-accept" onclick="acceptCall()">Принять</button>
        <button class="btn-hangup" onclick="endCall()">Завершить</button>
    </div>
</div>

<audio id="ringtone" src="https://www.soundjay.com/phone/phone-calling-1.mp3" loop></audio>

<script>
    // 1. КОНФИГУРАЦИЯ FIREBASE (Вставь свои данные здесь!)
    const firebaseConfig = {
        apiKey: "ТВОЙ_КЛЮЧ",
        authDomain: "ТВОЙ_ПРОЕКТ.firebaseapp.com",
        databaseURL: "https://ТВОЙ_ПРОЕКТ.firebaseio.com",
        projectId: "ТВОЙ_ПРОЕКТ",
        storageBucket: "ТВОЙ_ПРОЕКТ.appspot.com",
        messagingSenderId: "ID",
        appId: "APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. ИНИЦИАЛИЗАЦИЯ ПОЛЬЗОВАТЕЛЯ
    let myName = localStorage.getItem('chat_name') || prompt("Ваше имя:");
    if(!myName) location.reload();
    localStorage.setItem('chat_name', myName);

    const peer = new Peer(myName);
    let partner = "";
    let localStream;
    let currentCall;
    let inData = null;

    // 3. СПИСОК КОНТАКТОВ
    const contacts = ["User1", "User2", "User3"]; // Замени на реальных пользователей
    const contactsDiv = document.getElementById('contacts');
    contacts.forEach(c => {
        if(c !== myName) {
            const div = document.createElement('div');
            div.className = 'contact';
            div.innerText = c;
            div.onclick = () => { partner = c; loadMessages(); };
            contactsDiv.appendChild(div);
        }
    });

    // 4. ЧАТ
    function sendMessage() {
        const text = document.getElementById('msgInput').value;
        if(!text || !partner) return;
        const id = myName < partner ? `${myName}_${partner}` : `${partner}_${myName}`;
        db.ref(`chats/${id}`).push({ sender: myName, text: text });
        document.getElementById('msgInput').value = "";
    }

    function loadMessages() {
        const id = myName < partner ? `${myName}_${partner}` : `${partner}_${myName}`;
        db.ref(`chats/${id}`).on('value', snap => {
            const area = document.getElementById('messages');
            area.innerHTML = "";
            snap.forEach(m => {
                const d = m.val();
                const div = document.createElement('div');
                div.className = `msg ${d.sender === myName ? 'my-msg' : 'p-msg'}`;
                div.innerText = d.text;
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        });
    }

    // 5. ЛОГИКА ЗВОНКОВ (ИСПРАВЛЕННАЯ)
    
    // Входящий звонок (через Firebase)
    db.ref(`calls/${myName}`).on('value', snap => {
        inData = snap.val();
        if(inData && inData.active) {
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'block';
            document.getElementById('call-status').innerText = `Входящий ${inData.video ? 'видео' : 'аудио'} звонок от ${inData.from}`;
            document.getElementById('ringtone').play().catch(e => console.log("Нужен клик для звука"));
            partner = inData.from;
        }
    });

    // Начать звонок
    async function startCallProcess(isVideo) {
        if(!partner) return alert("Выберите контакт!");
        try {
            // Запрашиваем доступ (Важно: и видео, и аудио)
            localStream = await navigator.mediaDevices.getUserMedia({
                video: isVideo, 
                audio: true 
            });
            document.getElementById('localVid').srcObject = localStream;
            
            // Сигнализируем в Firebase
            db.ref(`calls/${partner}`).set({from: myName, video: isVideo, active: true});
            
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'none';
            document.getElementById('call-status').innerText = "Вызов...";

            // Ждем инициализации Peer и звоним
            const call = peer.call(partner, localStream);
            handleCall(call);
        } catch(e) {
            alert("Ошибка доступа к камере/микрофону: " + e.message);
        }
    }

    // Принять звонок
    async function acceptCall() {
        document.getElementById('ringtone').pause();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: inData.video, 
                audio: true 
            });
            document.getElementById('localVid').srcObject = localStream;
            
            // Отвечаем на звонок в PeerJS
            if(currentCall) {
                currentCall.answer(localStream);
            }
            
            document.getElementById('btn-accept').style.display = 'none';
            document.getElementById('call-status').innerText = "В разговоре";
            // Убираем флаг звонка в БД
            db.ref(`calls/${myName}`).update({active: false});
        } catch(e) {
            alert("Ошибка при принятии звонка: " + e.message);
        }
    }

    // Обработка входящего потока (PeerJS)
    peer.on('call', call => {
        currentCall = call;
        // Если мы уже в экране звонка (нажали принять), поток обработается тут:
        call.on('stream', rs => {
            const remoteVid = document.getElementById('remoteVid');
            remoteVid.srcObject = rs;
            remoteVid.muted = false; // Принудительно включаем звук
            remoteVid.play();
        });
    });

    function handleCall(call) {
        currentCall = call;
        call.on('stream', rs => {
            const remoteVid = document.getElementById('remoteVid');
            remoteVid.srcObject = rs;
            remoteVid.muted = false;
            remoteVid.play();
            document.getElementById('call-status').innerText = "В разговоре";
        });
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(currentCall) currentCall.close();
        db.ref(`calls/${partner}`).set(null);
        db.ref(`calls/${myName}`).set(null);
        location.reload(); // Простой способ сбросить всё
    }

</script>
</body>
</html>
