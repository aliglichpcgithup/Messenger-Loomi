<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loomi 2026 Pro Max</title>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { 
            --green-neon: #00ffa3; 
            --green-glow: rgba(0, 255, 163, 0.5);
            --bg-dark: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-thick: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --my-msg-grad: linear-gradient(135deg, #00ffa3 0%, #059669 100%);
            --others-msg-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ff453a;
            --sidebar-width: 340px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            height: 100dvh; 
            background-color: var(--bg-dark); 
            color: var(--text-primary); 
            overflow: hidden; 
            display: flex;
            background: radial-gradient(circle at 0% 0%, #0f172a 0%, #020617 100%);
        }

        .bg-glow {
            position: fixed; width: 40vw; height: 40vw; 
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0;
            animation: moveGlow 20s infinite alternate;
        }
        @keyframes moveGlow { from { top: -10%; left: -10%; } to { top: 60%; left: 70%; } }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { 
            background: var(--glass-thick); 
            padding: 60px 40px; border-radius: 40px; 
            width: 90%; max-width: 440px; text-align: center; 
            border: 1px solid var(--glass-border); backdrop-filter: blur(50px);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
        }
        .auth-card h1 { font-size: 4rem; font-weight: 800; color: var(--green-neon); margin-bottom: 40px; letter-spacing: -6px; filter: drop-shadow(0 0 20px var(--green-glow)); }
        .auth-input { 
            width: 100%; padding: 20px; margin-bottom: 15px; border-radius: 22px; 
            border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.3); 
            color: white; outline: none; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); font-size: 16px;
        }
        .auth-input:focus { border-color: var(--green-neon); background: rgba(0, 0, 0, 0.5); transform: scale(1.02); }
        .auth-btn { 
            width: 100%; padding: 20px; background: var(--green-neon); color: #020617; 
            border: none; border-radius: 22px; font-weight: 800; cursor: pointer; 
            transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 20px 40px -10px var(--green-glow);
        }

        /* Sidebar Responsive */
        .sidebar { 
            width: var(--sidebar-width); 
            background: rgba(2, 6, 23, 0.6); 
            border-right: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; 
            backdrop-filter: blur(40px); z-index: 10; 
            transition: transform 0.3s ease;
        }
        .sidebar-header { padding: 40px 25px 25px 25px; }
        .profile-row { display: flex; align-items: center; gap: 15px; background: var(--glass); padding: 15px; border-radius: 25px; border: 1px solid var(--glass-border); }
        .user-av { 
            width: 50px; height: 50px; background: var(--my-msg-grad); 
            border-radius: 18px; display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #020617; text-transform: uppercase; flex-shrink: 0; font-size: 22px;
        }
        
        .sidebar-btn { 
            padding: 12px; background: var(--glass); border: 1px solid var(--glass-border); 
            color: var(--text-primary); border-radius: 15px; cursor: pointer; 
            font-weight: 700; font-size: 11px; transition: 0.3s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .sidebar-btn:hover { background: var(--green-neon); color: #020617; border-color: transparent; }

        .section-label { font-size: 11px; font-weight: 800; color: var(--text-secondary); margin: 20px 25px 10px; letter-spacing: 2px; text-transform: uppercase; }

        .contact-item { 
            padding: 14px 20px; cursor: pointer; display: flex; align-items: center; 
            gap: 15px; transition: 0.3s; margin: 2px 15px; border-radius: 20px;
        }
        .contact-item:hover { background: var(--glass); }
        .contact-item.active { background: rgba(0, 255, 163, 0.12); border: 1px solid rgba(0, 255, 163, 0.2); }

        /* Chat Area Responsive */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .chat-header { 
            padding: 20px 25px; display: flex; align-items: center; gap: 15px; 
            border-bottom: 1px solid var(--glass-border); background: rgba(2, 6, 23, 0.3); 
            backdrop-filter: blur(25px);
        }

        #messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .msg { 
            padding: 14px 20px; border-radius: 22px; max-width: 85%; 
            font-size: 15px; line-height: 1.6; position: relative;
            word-wrap: break-word;
        }
        .msg.mine { 
            align-self: flex-end; background: var(--my-msg-grad); color: #020617; 
            border-bottom-right-radius: 6px; font-weight: 600;
            box-shadow: 0 10px 25px -10px var(--green-glow);
        }
        .msg.others { 
            align-self: flex-start; background: var(--others-msg-bg); color: white; 
            border-bottom-left-radius: 6px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .msg-author { font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--green-neon); text-transform: uppercase; }
        .msg-time { font-size: 10px; margin-top: 8px; opacity: 0.5; text-align: right; font-weight: 600; }

        /* Media Elements */
        .msg-img { max-width: 100%; border-radius: 12px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .msg-file { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 12px; margin: 10px 0; color: white; text-decoration: none; font-size: 13px; }
        audio { height: 35px; margin-top: 10px; border-radius: 10px; filter: invert(1); width: 100%; min-width: 150px; }

        /* Footer */
        .chat-footer { 
            padding: 15px 20px; display: flex; gap: 10px; align-items: center; 
            background: rgba(2, 6, 23, 0.4); backdrop-filter: blur(20px);
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-box {
            flex: 1; background: rgba(0, 0, 0, 0.3); border-radius: 25px; 
            padding: 10px 15px; border: 1px solid var(--glass-border);
            display: flex; align-items: center; transition: 0.3s;
        }
        .btn-footer { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; transition: 0.2s; padding: 5px; }
        .btn-footer:hover { color: var(--green-neon); }
        .btn-footer.recording { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-send { 
            width: 45px; height: 45px; border-radius: 15px; border: none; 
            background: var(--my-msg-grad); color: #020617; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        #custom-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-card { background: #0f172a; padding: 30px; border-radius: 30px; border: 1px solid var(--glass-border); width: 90%; max-width: 400px; }

        /* Mobile specific logic */
        .back-btn { display: none; background: none; border: none; font-size: 24px; color: var(--green-neon); cursor: pointer; margin-right: 10px; }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 100%;
                z-index: 100;
            }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
            .back-btn { display: block; }
            .msg { max-width: 90%; }
            .sidebar-header { padding-top: calc(20px + env(safe-area-inset-top)); }
            .auth-card { padding: 40px 20px; }
        }

        @media (min-width: 769px) {
            .msg { max-width: 65%; }
            .chat-header { padding: 25px 40px; }
            #messages { padding: 40px; }
            .chat-footer { padding: 30px 40px; }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>LOOMI</h1>
        <div id="auth-form">
            <input type="text" id="a-name" class="auth-input" placeholder="Логин">
            <input type="password" id="a-pass" class="auth-input" placeholder="Код">
            <button onclick="login()" class="auth-btn">Авторизация</button>
            <div id="auth-error" style="color: var(--danger); margin-top: 25px; font-weight: 700;"></div>
        </div>
    </div>
</div>

<div id="custom-modal" onclick="if(event.target === this) closeModal()">
    <div class="modal-card" id="modal-body"></div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-row">
            <div class="user-av" id="my-av">?</div>
            <div style="flex:1">
                <b id="my-name-display" style="font-size: 18px;">...</b>
                <div style="font-size: 10px; color: var(--green-neon); font-weight: 800;">PREMIUM CLOUD</div>
            </div>
            <button onclick="logout()" style="background:none; border:none; cursor:pointer; font-size: 20px;">🔒</button>
        </div>
        <div style="display:flex; gap:10px; margin-top: 20px;">
            <button class="sidebar-btn" onclick="openFindModal()">🔍 КОНТАКТ</button>
            <button class="sidebar-btn" onclick="openCreateGroupModal()">👥 ГРУППА</button>
        </div>
    </div>
    
    <div class="section-label">Каналы</div>
    <div id="groupsList"></div>
    
    <div class="section-label">Личные</div>
    <div id="contactsList" style="flex:1; overflow-y:auto;"></div>
</div>

<div class="chat-area">
    <div id="welcome" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align: center;">
        <div style="font-size: 80px; filter: drop-shadow(0 0 20px var(--green-glow)); cursor: pointer;" onclick="toggleSidebarOnMobile()">💠</div>
        <h2 style="letter-spacing: 8px; margin-top: 20px; color: var(--green-neon);">LOOMI 2026</h2>
        <p style="color: var(--text-secondary); margin-top: 10px; font-weight: 600;">FILES & VOICE ENABLED</p>
        <button class="sidebar-btn" style="max-width: 200px; margin-top: 20px;" onclick="toggleSidebarOnMobile()">ОТКРЫТЬ ЧАТЫ</button>
    </div>

    <div id="chat-ui" style="display:none; flex:1; flex-direction:column;">
        <div class="chat-header">
            <button class="back-btn" onclick="toggleSidebarOnMobile()">‹</button>
            <div class="user-av" id="partner-av" style="width: 40px; height: 40px; font-size: 18px;">?</div>
            <div style="flex:1">
                <b id="p-name" style="font-size: 18px;">...</b>
                <div id="p-status" style="font-size: 10px; color: var(--green-neon);">ONLINE SECURE</div>
            </div>
        </div>
        
        <div id="messages"></div>
        
        <div class="chat-footer">
            <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(this)">
            <button class="btn-footer" onclick="document.getElementById('file-input').click()">📎</button>
            <button class="btn-footer" id="mic-btn" onclick="toggleVoiceRecord()">🎤</button>
            
            <form style="flex:1; display:flex; gap:10px;" onsubmit="sendMsg(event)">
                <div class="input-box">
                    <input type="text" id="m-inp" style="width:100%; background:none; border:none; color:white; outline:none;" placeholder="Сообщение..." autocomplete="off">
                </div>
                <button type="submit" class="btn-send">🚀</button>
            </form>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentUser = null;
    let activeChatId = null;
    let chatType = 'direct';
    let partnerName = null;

    // Voice Variables
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Mobile Toggle
    function toggleSidebarOnMobile() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
    }

    async function login() {
        const name = document.getElementById('a-name').value.trim().toLowerCase();
        const pass = document.getElementById('a-pass').value.trim();
        if(!name || !pass) return;
        const userRef = db.ref(`users/${name}`);
        const snap = await userRef.once('value');
        if(snap.exists() && snap.val().pass !== pass) {
            document.getElementById('auth-error').innerText = "ДОСТУП ЗАПРЕЩЕН";
            return;
        }
        if(!snap.exists()) await userRef.set({ pass, created: Date.now() });
        currentUser = name;
        localStorage.setItem('loomi_v13_auth', JSON.stringify({name, pass}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = name.toUpperCase();
        document.getElementById('my-av').innerText = name[0];
        initApp();
    }

    function initApp() {
        db.ref(`contacts/${currentUser}`).on('value', snap => {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            snap.forEach(child => {
                const id = child.key;
                const name = child.val().name || id;
                const div = document.createElement('div');
                div.className = `contact-item ${activeChatId === id ? 'active' : ''}`;
                div.innerHTML = `<div class="user-av" style="background:var(--glass); font-size:18px">${name[0]}</div><div style="flex:1"><b>${name.toUpperCase()}</b></div>`;
                div.onclick = () => {
                    openChat(id, name, 'direct');
                    if(window.innerWidth <= 768) toggleSidebarOnMobile();
                };
                list.appendChild(div);
            });
        });

        db.ref(`user_groups/${currentUser}`).on('value', snap => {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            snap.forEach(child => {
                const gId = child.key;
                const name = child.val().name;
                const div = document.createElement('div');
                div.className = `contact-item ${activeChatId === gId ? 'active' : ''}`;
                div.innerHTML = `<div class="user-av" style="background:rgba(0,255,163,0.1); color:var(--green-neon); font-size:18px">👥</div><div style="flex:1"><b>${name.toUpperCase()}</b></div>`;
                div.onclick = () => {
                    openChat(gId, name, 'group');
                    if(window.innerWidth <= 768) toggleSidebarOnMobile();
                };
                list.appendChild(div);
            });
        });
    }

    function openChat(id, name, type) {
        activeChatId = id; partnerName = name; chatType = type;
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('p-name').innerText = name.toUpperCase();
        document.getElementById('partner-av').innerText = type === 'group' ? '👥' : name[0];
        
        const msgPath = type === 'group' ? `group_messages/${id}` : `messages/${id}`;
        db.ref(msgPath).off();
        db.ref(msgPath).limitToLast(40).on('value', snap => {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            snap.forEach(mSnap => {
                const m = mSnap.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === currentUser ? 'mine' : 'others'}`;
                
                let content = `<div>${m.text || ''}</div>`;
                if(m.type === 'image') content += `<img src="${m.fileData}" class="msg-img" onclick="window.open(this.src)">`;
                else if(m.type === 'file') content += `<a href="${m.fileData}" download="${m.fileName}" class="msg-file">📄 ${m.fileName.substring(0, 20)}...</a>`;
                else if(m.type === 'voice') content += `<audio controls src="${m.fileData}"></audio>`;

                let author = (type === 'group' && m.from !== currentUser) ? `<div class="msg-author">${m.from}</div>` : '';
                div.innerHTML = `${author}${content}<span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    async function sendMsg(e) {
        if(e) e.preventDefault();
        const inp = document.getElementById('m-inp');
        if(!inp.value.trim() || !activeChatId) return;
        await pushToDb({ from: currentUser, text: inp.value.trim(), type: 'text' });
        inp.value = '';
    }

    async function pushToDb(data) {
        const msgPath = chatType === 'group' ? `group_messages/${activeChatId}` : `messages/${activeChatId}`;
        data.time = Date.now();
        await db.ref(msgPath).push(data);
    }

    // --- File Handling ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if(!file) return;
        if(file.size > 2 * 1024 * 1024) { 
            alert("Файл слишком большой. Лимит 2МБ.");
            return;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
            const fileData = e.target.result;
            const type = file.type.startsWith('image/') ? 'image' : 'file';
            await pushToDb({
                from: currentUser,
                type: type,
                fileData: fileData,
                fileName: file.name,
                time: Date.now()
            });
        };
        reader.readAsDataURL(file);
        input.value = '';
    }

    // --- Voice Recording ---
    async function toggleVoiceRecord() {
        const btn = document.getElementById('mic-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        await pushToDb({
                            from: currentUser,
                            type: 'voice',
                            fileData: e.target.result,
                            time: Date.now()
                        });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerText = '🔴';
            } catch (err) {
                alert("Нет доступа к микрофону");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
            btn.innerText = '🎤';
        }
    }

    // --- UI Modals ---
    function openFindModal() {
        const modal = document.getElementById('custom-modal');
        modal.style.display = 'flex';
        document.getElementById('modal-body').innerHTML = `
            <h2 style="margin-bottom:20px;">Новый контакт</h2>
            <input type="text" id="m-find-input" class="auth-input" placeholder="Логин">
            <button onclick="confirmAddUser()" class="auth-btn">Добавить</button>
        `;
    }

    async function confirmAddUser() {
        const target = document.getElementById('m-find-input').value.trim().toLowerCase();
        if(!target || target === currentUser) return;
        const exists = await db.ref(`users/${target}`).once('value');
        if(exists.exists()) {
            await db.ref(`contacts/${currentUser}/${target}`).set({ name: target });
            await db.ref(`contacts/${target}/${currentUser}`).set({ name: currentUser });
            closeModal();
        } else alert("Пользователь не найден");
    }

    function openCreateGroupModal() {
        const modal = document.getElementById('custom-modal');
        modal.style.display = 'flex';
        document.getElementById('modal-body').innerHTML = `
            <h2 style="margin-bottom:20px;">Создать группу</h2>
            <input type="text" id="g-name-input" class="auth-input" placeholder="Название">
            <input type="text" id="g-members-input" class="auth-input" placeholder="Участники (через запятую)">
            <button onclick="confirmCreateGroup()" class="auth-btn">Создать</button>
        `;
    }

    async function confirmCreateGroup() {
        const gName = document.getElementById('g-name-input').value.trim();
        const membersStr = document.getElementById('g-members-input').value.trim().toLowerCase();
        if(!gName) return;
        const gId = 'group_' + Date.now();
        const members = membersStr.split(',').map(m => m.trim()).filter(m => m !== "");
        members.push(currentUser);
        await db.ref(`groups/${gId}`).set({ name: gName, creator: currentUser, members });
        for(let m of members) await db.ref(`user_groups/${m}/${gId}`).set({ name: gName });
        closeModal();
    }

    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }
    function logout() { localStorage.clear(); location.reload(); }
    function loginCheck() {
        const saved = localStorage.getItem('loomi_v13_auth');
        if(saved) {
            const d = JSON.parse(saved);
            document.getElementById('a-name').value = d.name;
            document.getElementById('a-pass').value = d.pass;
            login();
        }
    }
    window.onload = () => {
        loginCheck();
        if(window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('hidden');
        }
    };
</script>
</body>
</html>
