<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loomi Messenger 2025</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --l-green: #25D366; --bg: #0b141a; --dark: #111b21; --light: #e9edef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--light); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        #auth-screen { background: var(--dark); padding: 40px; border-radius: 20px; text-align: center; width: 350px; border: 1px solid #333; }
        .inp { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
        .btn-main { width: 100%; padding: 12px; background: var(--l-green); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .app { width: 100vw; height: 100vh; display: none; }
        .sidebar { width: 300px; background: var(--dark); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: #0b141a; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; color: white; position: relative; }
        .msg.mine { align-self: flex-end; background: #005c4b; }
        .msg.others { align-self: flex-start; background: #202c33; }

        /* Звонки */
        #call-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #localVid { width: 120px; height: 160px; top: 20px; right: 20px; border: 2px solid white; border-radius: 10px; z-index: 10; object-fit: cover; }
        .call-controls { position: absolute; bottom: 40px; display: flex; gap: 20px; z-index: 100; }
        .c-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; color: white; display: flex; align-items: center; justify-content: center; }
        .c-red { background: #ff3b30; }
        .c-green { background: #25D366; }
        
        .header { padding: 15px; background: #202c33; display: flex; justify-content: space-between; align-items: center; }
        .footer { padding: 10px; background: #202c33; display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<audio id="ringtone" loop src="https://www.soundjay.com/phone/phone-calling-1.mp3"></audio>

<div id="auth-screen">
    <h2 style="color: var(--l-green);">Loomi</h2>
    <input type="text" id="a-name" class="inp" placeholder="Ваше имя">
    <button class="btn-main" onclick="login()">ВОЙТИ</button>
</div>

<div class="app" id="app">
    <div id="call-screen">
        <video id="remoteVid" autoplay playsinline></video>
        <video id="localVid" autoplay muted playsinline></video>
        <div class="call-controls">
            <button id="btn-accept" class="c-btn c-green" onclick="acceptCall()">📞</button>
            <button class="c-btn c-red" onclick="endCall()">🛑</button>
        </div>
    </div>

    <div class="sidebar">
        <div style="padding:20px;">
            <h3 id="my-name-tag">...</h3>
            <button onclick="addFriend()" style="color:var(--l-green); background:none; border:none; cursor:pointer;">+ Добавить контакт</button>
        </div>
        <div id="contactsBox"></div>
    </div>

    <div class="chat-area">
        <div class="header">
            <h4 id="chat-title">Выберите чат</h4>
            <div id="chat-tools" style="display:none; gap:20px;">
                <span onclick="startCall(true)" style="cursor:pointer; font-size:22px;">📹</span>
                <span onclick="startCall(false)" style="cursor:pointer; font-size:22px;">📞</span>
            </div>
        </div>
        <div id="messages"></div>
        <form class="footer" onsubmit="sendMsg(event)">
            <input type="text" id="m-inp" class="inp" style="margin:0;" placeholder="Сообщение" disabled>
            <button type="button" id="voice-btn" class="c-btn" style="width:40px; height:40px; font-size:18px; background:#2a3942;" onclick="toggleVoice()">🎤</button>
            <button type="submit" style="background:none; border:none; font-size:24px; cursor:pointer;">🚀</button>
        </form>
    </div>
</div>

<script>
    // КОНФИГ
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, peer, localStream, currentCall, inData;
    let mediaRec, audioCh = [];

    async function login() {
        myName = document.getElementById('a-name').value.trim();
        if(!myName) return;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('my-name-tag').innerText = myName;

        initPeer();
        loadContacts();
        listenSignals();
    }

    function initPeer() {
        peer = new Peer(myName, {
            config: {'iceServers': [
                { 'urls': 'stun:stun.l.google.com:19302' },
                { 'urls': 'stun:stun1.l.google.com:19302' }
            ]}
        });

        peer.on('open', (id) => console.log('Peer ID создан:', id));
        
        // Входящий звонок
        peer.on('call', call => {
            console.log('Входящий звонок...');
            currentCall = call;
        });
        
        peer.on('error', err => {
            console.error('PeerJS Error:', err.type);
            if(err.type === 'peer-unavailable') alert("Пользователь не в сети");
        });
    }

    function listenSignals() {
        db.ref(`calls/${myName}`).on('value', snap => {
            const d = snap.val();
            if(d && d.active) {
                inData = d;
                document.getElementById('ringtone').play().catch(()=>{});
                document.getElementById('call-screen').style.display = 'flex';
                document.getElementById('btn-accept').style.display = 'flex';
            } else if (!d) {
                stopAllMedia();
            }
        });
    }

    async function startCall(isVideo) {
        if(!partner) return;
        try {
            // 1. Сначала запрашиваем доступ к камере
            localStream = await navigator.mediaDevices.getUserMedia({video: isVideo, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            
            // 2. Оповещаем собеседника через Firebase
            db.ref(`calls/${partner}`).set({from: myName, video: isVideo, active: true});
            
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'none';

            // 3. Совершаем звонок через PeerJS
            const call = peer.call(partner, localStream);
            if(call) {
                currentCall = call;
                call.on('stream', rs => {
                    document.getElementById('remoteVid').srcObject = rs;
                });
            }
        } catch(e) {
            alert("Нет доступа к камере/микрофону! Проверьте chrome://flags");
        }
    }

    async function acceptCall() {
        document.getElementById('ringtone').pause();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video: inData.video, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            
            if(currentCall) {
                currentCall.answer(localStream);
                currentCall.on('stream', rs => {
                    document.getElementById('remoteVid').srcObject = rs;
                });
            }
            
            document.getElementById('btn-accept').style.display = 'none';
            db.ref(`calls/${myName}`).update({active: false});
        } catch(e) {
            console.error(e);
            alert("Ошибка при приеме звонка");
        }
    }

    function endCall() {
        if(partner) db.ref(`calls/${partner}`).remove();
        db.ref(`calls/${myName}`).remove();
        stopAllMedia();
    }

    function stopAllMedia() {
        document.getElementById('ringtone').pause();
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        if(currentCall) currentCall.close();
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('remoteVid').srcObject = null;
    }

    // --- ЧАТ ---
    function addFriend() { 
        let f = prompt("Имя контакта:"); 
        if(f) db.ref(`users/${myName}/friends/${f}`).set(true); 
    }

    function loadContacts() {
        db.ref(`users/${myName}/friends`).on('value', snap => {
            const b = document.getElementById('contactsBox'); b.innerHTML = '';
            Object.keys(snap.val() || {}).forEach(name => {
                const d = document.createElement('div');
                d.style = "padding:15px; cursor:pointer; border-bottom:1px solid #333";
                d.innerText = name;
                d.onclick = () => selectChat(name);
                b.appendChild(d);
            });
        });
    }

    function selectChat(name) {
        partner = name;
        document.getElementById('chat-title').innerText = name;
        document.getElementById('chat-tools').style.display = 'flex';
        document.getElementById('m-inp').disabled = false;
        
        db.ref(`chats/${[myName, partner].sort().join("_")}`).on('value', snap => {
            const box = document.getElementById('messages');
            box.innerHTML = ''; // Очистка дублей
            snap.forEach(c => {
                const m = c.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === myName ? 'mine' : 'others'}`;
                if(m.text) div.innerText = m.text;
                else if(m.audio) div.innerHTML = `<audio controls src="${m.audio}" style="width:180px;"></audio>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendMsg(e) {
        e.preventDefault(); 
        const i = document.getElementById('m-inp');
        if(!i.value) return;
        db.ref(`chats/${[myName, partner].sort().join("_")}`).push({from:myName, text:i.value, time:Date.now()});
        i.value = '';
    }

    async function toggleVoice() {
        const btn = document.getElementById('voice-btn');
        if (!mediaRec) {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(s);
                audioCh = [];
                mediaRec.ondataavailable = e => audioCh.push(e.data);
                mediaRec.onstop = () => {
                    const r = new FileReader();
                    r.readAsDataURL(new Blob(audioCh, { type: 'audio/webm' }));
                    r.onloadend = () => {
                        db.ref(`chats/${[myName, partner].sort().join("_")}`).push({from: myName, audio: r.result, time: Date.now()});
                    };
                    s.getTracks().forEach(t => t.stop());
                    mediaRec = null;
                };
                mediaRec.start();
                btn.innerText = '🛑'; btn.style.color = 'red';
            } catch (e) { alert("Ошибка микрофона"); }
        } else {
            mediaRec.stop();
            btn.innerText = '🎤'; btn.style.color = 'white';
        }
    }
</script>
</body>
</html>
