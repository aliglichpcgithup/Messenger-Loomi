<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loomi 2026 Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --green: #00a884; --bg: #0b141a; --dark: #111b21; --panel: #202c33; 
            --my-msg: #005c4b; --others-msg: #202c33; --accent: #e1b12c; 
            --text: #e9edef; --blue-tick: #53bdeb; --danger: #ff4b4b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; display: flex; }

        /* Mobile adaptation logic */
        .sidebar { width: 400px; background: var(--dark); border-right: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; transition: 0.3s; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; transition: 0.3s; z-index: 10; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; inset: 0; z-index: 20; }
            .chat-area { width: 100%; position: absolute; inset: 0; z-index: 10; transform: translateX(100%); }
            body.chat-open .chat-area { transform: translateX(0); z-index: 30; }
            body.chat-open .sidebar { transform: translateX(-20%); }
        }

        /* Elements styling */
        .header { background: var(--panel); padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 64px; }
        .user-av { width: 40px; height: 40px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid var(--green); flex-shrink: 0; }
        .contact-item { padding: 12px 16px; border-bottom: 1px solid #1c262d; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .contact-item:active { background: #2a3942; }
        
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: rgba(11,20,26,0.9); }
        
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; position: relative; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .msg.mine { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--others-msg); border-top-left-radius: 2px; }
        
        .footer { background: var(--panel); padding: 8px 12px; display: flex; align-items: center; gap: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
        .inp-wrap { flex: 1; background: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 2px 12px; }
        .inp-wrap input { flex: 1; background: none; border: none; padding: 10px; color: white; outline: none; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .btn-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #8696a0; }
        .btn-circle:hover { background: rgba(255,255,255,0.1); }
        
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; }
    </style>
</head>
<body class="">

<div id="auth-screen">
    <div class="bg-[#111b21] p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl text-center">
        <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-emerald-400 to-amber-400 bg-clip-text text-transparent">Loomi</h1>
        <p class="text-white/50 mb-6 text-sm">Secure Communication 2026</p>
        <div class="space-y-4">
            <input type="text" id="a-name" class="w-full bg-[#2a3942] p-4 rounded-xl outline-none border border-transparent focus:border-emerald-500 transition-all" placeholder="Логин">
            <input type="password" id="a-pass" class="w-full bg-[#2a3942] p-4 rounded-xl outline-none border border-transparent focus:border-emerald-500 transition-all" placeholder="Пароль">
            <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 p-4 rounded-xl font-bold transition-all transform active:scale-95">ВОЙТИ</button>
        </div>
    </div>
</div>

<div class="sidebar">
    <div class="header">
        <div class="user-av" id="my-av">?</div>
        <div class="flex-1">
            <b id="my-name-display" class="text-emerald-500 text-sm">...</b>
            <div class="text-[10px] opacity-50 uppercase tracking-widest">Онлайн</div>
        </div>
        <button onclick="logout()" class="btn-circle">🚪</button>
    </div>
    <div class="p-3 bg-[#111b21] flex gap-2">
        <button onclick="addChat(false)" class="flex-1 bg-emerald-600/20 text-emerald-400 py-2 rounded-lg text-xs font-bold border border-emerald-600/30">+ КОНТАКТ</button>
        <button onclick="addChat(true)" class="flex-1 bg-amber-600/20 text-amber-400 py-2 rounded-lg text-xs font-bold border border-amber-600/30">+ ГРУППА</button>
    </div>
    <div id="contactsList" class="flex-1 overflow-y-auto"></div>
</div>

<div class="chat-area">
    <div class="header" id="chat-header" style="display:none">
        <button onclick="closeChat()" class="md:hidden mr-2 text-2xl">←</button>
        <div class="user-av" id="partner-av">?</div>
        <div class="flex-1 overflow-hidden">
            <b id="p-name" class="block truncate">ЧАТ</b>
            <div id="p-status" class="text-xs text-emerald-500">...</div>
        </div>
        <div class="flex gap-2">
            <button onclick="startCall()" class="btn-circle">📞</button>
            <button onclick="clearHistory()" class="btn-circle">🗑️</button>
        </div>
    </div>

    <div id="messages"></div>

    <div id="reply-preview" class="hidden bg-[#202c33] p-2 border-t border-white/5 flex items-center justify-between">
        <div class="border-l-4 border-amber-500 pl-3">
            <small id="reply-user" class="text-amber-500 font-bold block"></small>
            <div id="reply-text" class="text-xs opacity-60 truncate max-w-[200px]"></div>
        </div>
        <button onclick="cancelReply()" class="p-2">✕</button>
    </div>

    <form class="footer" onsubmit="handleSend(event)">
        <label class="btn-circle">📎<input type="file" id="file-input" hidden onchange="uploadFile(this)"></label>
        <div class="inp-wrap">
            <input type="text" id="m-inp" placeholder="Сообщение..." oninput="handleTyping()" disabled autocomplete="off">
            <button type="button" class="px-2" onclick="alert('Emojis coming soon')">😊</button>
        </div>
        <button type="submit" class="p-2 text-3xl text-emerald-500">🚀</button>
    </form>
</div>

<div id="call-ui">
    <div class="flex-1 relative">
        <video id="remote-v" class="w-full h-full object-cover" autoplay playsinline></video>
        <video id="local-v" class="absolute bottom-24 right-4 w-28 h-40 rounded-xl border-2 border-emerald-500 object-cover" autoplay playsinline muted></video>
        <div class="absolute top-12 w-full text-center">
            <h2 id="call-partner-name" class="text-2xl font-bold">Имя</h2>
            <p class="opacity-70">Видеовызов...</p>
        </div>
    </div>
    <div class="h-32 bg-black/50 backdrop-blur-md flex items-center justify-center gap-8">
        <button onclick="toggleMic()" class="btn-circle bg-white/10 w-16 h-16 text-2xl">🎤</button>
        <button onclick="endCall()" class="w-20 h-20 bg-red-600 rounded-full text-3xl shadow-lg shadow-red-600/40">📞</button>
        <button onclick="toggleVideo()" class="btn-circle bg-white/10 w-16 h-16 text-2xl">📷</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, chatId, isGroup, tTimeout, pc, localStream;
    let replyData = null;

    async function login() {
        const n = document.getElementById('a-name').value.trim().toLowerCase();
        const p = document.getElementById('a-pass').value.trim();
        if(!n || !p) return;
        
        const snap = await db.ref(`users/${n}`).once('value');
        if(snap.exists() && snap.val().pass !== p) return alert("Неверный пароль");
        if(!snap.exists()) await db.ref(`users/${n}`).set({pass:p, joined: Date.now()});
        
        myName = n;
        localStorage.setItem('loomi_auth', JSON.stringify({n, p}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = myName.toUpperCase();
        document.getElementById('my-av').innerText = myName[0].toUpperCase();
        
        db.ref(`status/${myName}`).set(true);
        db.ref(`status/${myName}`).onDisconnect().remove();
        
        loadContacts();
        listenForCalls();
    }

    function loadContacts() {
        db.ref(`users/${myName}/chats`).on('value', snap => {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            snap.forEach(c => {
                const name = c.key;
                const isG = c.val().isGroup;
                const d = document.createElement('div');
                d.className = 'contact-item';
                d.innerHTML = `
                    <div class="user-av">${name[0].toUpperCase()}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center">
                            <b class="truncate text-sm uppercase">${isG ? '👥 ' : ''}${name}</b>
                            <span id="unread-${name}" class="hidden bg-emerald-500 text-[10px] px-2 py-0.5 rounded-full text-white">0</span>
                        </div>
                        <div id="stat-${name}" class="text-[10px] opacity-40">...</div>
                    </div>
                `;
                d.onclick = () => openChat(name, isG);
                list.appendChild(d);

                if(!isG) {
                    db.ref(`status/${name}`).on('value', s => {
                        const el = document.getElementById(`stat-${name}`);
                        if(el) el.innerText = s.exists() ? 'в сети' : 'оффлайн';
                    });
                }

                // Unread counter
                const cId = isG ? `group_${name}` : [myName, name].sort().join('_');
                db.ref(`messages/${cId}`).on('value', mSnap => {
                    let unread = 0;
                    mSnap.forEach(m => { if(m.val().from !== myName && !m.val().seen) unread++; });
                    const badge = document.getElementById(`unread-${name}`);
                    if(badge) {
                        badge.innerText = unread;
                        badge.classList.toggle('hidden', unread === 0);
                    }
                });
            });
        });
    }

    function openChat(name, groupFlag) {
        partner = name; isGroup = groupFlag;
        chatId = isGroup ? `group_${name}` : [myName, partner].sort().join('_');
        
        document.body.classList.add('chat-open');
        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('p-name').innerText = partner.toUpperCase();
        document.getElementById('partner-av').innerText = partner[0].toUpperCase();
        document.getElementById('m-inp').disabled = false;
        
        db.ref(`messages/${chatId}`).off();
        db.ref(`messages/${chatId}`).on('value', snap => {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            snap.forEach(mSnap => {
                const m = mSnap.val();
                if(m.from !== myName && !m.seen) db.ref(`messages/${chatId}/${mSnap.key}`).update({seen:true});
                
                const d = document.createElement('div');
                d.className = `msg ${m.from === myName ? 'mine' : 'others'}`;
                
                let html = '';
                if(m.reply) html += `<div class="bg-black/20 p-2 rounded mb-1 text-xs border-l-2 border-emerald-500"><b>${m.reply.user}</b>: ${m.reply.text}</div>`;
                if(m.text) html += `<div>${m.text}</div>`;
                
                const time = new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                html += `<div class="text-[9px] opacity-50 text-right mt-1">${time} ${m.from === myName ? (m.seen ? '✓✓' : '✓') : ''}</div>`;
                
                d.innerHTML = html;
                d.oncontextmenu = (e) => { e.preventDefault(); setupReply(m.from, m.text); };
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function closeChat() {
        document.body.classList.remove('chat-open');
    }

    function handleSend(e) {
        e.preventDefault();
        const inp = document.getElementById('m-inp');
        if(!inp.value.trim()) return;
        
        const msg = { from: myName, text: inp.value, time: Date.now(), seen: false };
        if(replyData) { msg.reply = replyData; cancelReply(); }
        
        db.ref(`messages/${chatId}`).push(msg);
        inp.value = '';
        db.ref(`typing/${myName}/${partner}`).remove();
    }

    function setupReply(user, text) {
        replyData = { user, text: text.substring(0, 30) };
        document.getElementById('reply-user').innerText = user;
        document.getElementById('reply-text').innerText = text;
        document.getElementById('reply-preview').classList.remove('hidden');
    }

    function cancelReply() {
        replyData = null;
        document.getElementById('reply-preview').classList.add('hidden');
    }

    function handleTyping() {
        if(!partner || isGroup) return;
        db.ref(`typing/${myName}/${partner}`).set(true);
        clearTimeout(tTimeout);
        tTimeout = setTimeout(() => db.ref(`typing/${myName}/${partner}`).remove(), 2000);
    }

    function addChat(g) {
        const n = prompt(g ? "Название группы:" : "Имя пользователя:");
        if(n) db.ref(`users/${myName}/chats/${n.toLowerCase()}`).set({isGroup:g});
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    async function startCall() {
        document.getElementById('call-ui').style.display = 'flex';
        document.getElementById('call-partner-name').innerText = partner;
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local-v').srcObject = localStream;
        // WebRTC logic remains similar to your original code...
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-ui').style.display = 'none';
    }

    window.onload = () => {
        const auth = localStorage.getItem('loomi_auth');
        if(auth) {
            const d = JSON.parse(auth);
            document.getElementById('a-name').value = d.n;
            document.getElementById('a-pass').value = d.p;
            login();
        }
    };
</script>
</body>
</html>
