<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loomi Messenger 2025</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --l-green: #25D366; --bg: #0b141a; --dark: #111b21; --light: #e9edef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--light); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Экран входа */
        #auth-screen { background: var(--dark); padding: 40px; border-radius: 20px; text-align: center; width: 350px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .inp { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
        .btn-main { width: 100%; padding: 12px; background: var(--l-green); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: #1da851; }

        /* Основной интерфейс */
        .app { width: 100vw; height: 100vh; display: none; }
        .sidebar { width: 320px; background: var(--dark); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }

        /* Контакты */
        .contact-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .contact-item:hover { background: #2a3942; }

        /* Сообщения */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #0b141a; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; position: relative; word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: #005c4b; color: white; }
        .msg.others { align-self: flex-start; background: #202c33; color: white; }

        /* Звонки */
        #call-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #remoteVid { width: 100%; height: 100%; object-fit: cover; }
        #localVid { width: 120px; height: 160px; position: absolute; top: 20px; right: 20px; border-radius: 12px; border: 2px solid white; z-index: 10; object-fit: cover; background: #222; }
        .call-controls { position: absolute; bottom: 40px; display: flex; gap: 20px; z-index: 100; }
        .c-btn { width: 65px; height: 65px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; color: white; display: flex; align-items: center; justify-content: center; }
        .c-red { background: #ff3b30; }
        .c-green { background: #25D366; }

        .header { padding: 15px; background: #202c33; display: flex; justify-content: space-between; align-items: center; }
        .footer { padding: 15px; background: #202c33; display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<audio id="ringtone" loop src="https://www.soundjay.com/phone/phone-calling-1.mp3"></audio>

<div id="auth-screen">
    <h1 style="color: var(--l-green); margin-bottom: 20px;">Loomi</h1>
    <input type="text" id="a-name" class="inp" placeholder="Ваше имя (на латинице)">
    <button class="btn-main" onclick="login()">ВОЙТИ В СЕТЬ</button>
</div>

<div class="app" id="app">
    <div id="call-screen">
        <video id="remoteVid" autoplay playsinline></video>
        <video id="localVid" autoplay muted playsinline></video>
        <div class="call-controls">
            <button id="btn-accept" class="c-btn c-green" onclick="acceptCall()">📞</button>
            <button class="c-btn c-red" onclick="endCall()">🛑</button>
        </div>
    </div>

    <div class="sidebar">
        <div style="padding:20px; background: #202c33;">
            <h3 id="my-name-tag">...</h3>
            <button onclick="addFriend()" style="color:var(--l-green); background:none; border:none; cursor:pointer; font-size:12px; margin-top:5px;">+ Добавить друга</button>
        </div>
        <div id="contactsBox" style="overflow-y:auto; flex:1;"></div>
    </div>

    <div class="chat-area">
        <div class="header">
            <h4 id="chat-title">Выберите чат</h4>
            <div id="chat-tools" style="display:none; gap:25px;">
                <span onclick="startCall(true)" style="cursor:pointer; font-size:24px;">📹</span>
                <span onclick="startCall(false)" style="cursor:pointer; font-size:24px;">📞</span>
            </div>
        </div>
        <div id="messages"></div>
        <form class="footer" onsubmit="sendMsg(event)">
            <input type="text" id="m-inp" class="inp" style="margin:0;" placeholder="Сообщение..." disabled>
            <button type="button" id="voice-btn" class="c-btn" style="width:45px; height:45px; font-size:20px; background:#2a3942;" onclick="toggleVoice()">🎤</button>
            <button type="submit" style="background:none; border:none; font-size:28px; cursor:pointer;">🚀</button>
        </form>
    </div>
</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, peer, localStream, currentCall, inData, mediaRec, audioCh = [];
    let currentChatRef = null;

    async function login() {
        myName = document.getElementById('a-name').value.trim();
        if(!myName) return alert("Введите имя!");
        
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('my-name-tag').innerText = "Я: " + myName;

        initPeer();
        loadContacts();
        listenForCalls();
    }

    // --- ЗВОНКИ (PeerJS) ---
    function initPeer() {
        peer = new Peer(myName, {
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }]},
            debug: 1
        });

        peer.on('call', call => {
            console.log("Входящий вызов...");
            currentCall = call;
        });
    }

    function listenForCalls() {
        db.ref(`calls/${myName}`).on('value', snap => {
            const d = snap.val();
            if(d && d.active) {
                inData = d;
                document.getElementById('ringtone').play().catch(()=>{});
                document.getElementById('call-screen').style.display = 'flex';
                document.getElementById('btn-accept').style.display = 'flex';
            } else if (!d && document.getElementById('call-screen').style.display === 'flex') {
                stopAllMedia();
            }
        });
    }

    async function startCall(isVideo) {
        if(!partner) return;
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video: isVideo, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            
            db.ref(`calls/${partner}`).set({from: myName, video: isVideo, active: true});
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('btn-accept').style.display = 'none';

            const call = peer.call(partner, localStream);
            call.on('stream', rs => document.getElementById('remoteVid').srcObject = rs);
            currentCall = call;
        } catch(e) {
            alert("Ошибка: Камера/микрофон заблокированы. Проверьте настройки браузера!");
        }
    }

    async function acceptCall() {
        document.getElementById('ringtone').pause();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video: inData.video, audio: true});
            document.getElementById('localVid').srcObject = localStream;
            
            currentCall.answer(localStream);
            currentCall.on('stream', rs => document.getElementById('remoteVid').srcObject = rs);
            
            document.getElementById('btn-accept').style.display = 'none';
            db.ref(`calls/${myName}`).update({active: false});
        } catch(e) {
            alert("Не удалось подключить камеру.");
            endCall();
        }
    }

    function endCall() {
        if(partner) db.ref(`calls/${partner}`).remove();
        db.ref(`calls/${myName}`).remove();
        stopAllMedia();
    }

    function stopAllMedia() {
        document.getElementById('ringtone').pause();
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        if(currentCall) currentCall.close();
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('remoteVid').srcObject = null;
    }

    // --- ЧАТ И ГОЛОСОВЫЕ ---
    function addFriend() {
        let f = prompt("Имя друга для добавления:");
        if(f) db.ref(`users/${myName}/friends/${f}`).set(true);
    }

    function loadContacts() {
        db.ref(`users/${myName}/friends`).on('value', snap => {
            const b = document.getElementById('contactsBox'); b.innerHTML = '';
            Object.keys(snap.val() || {}).forEach(name => {
                const d = document.createElement('div');
                d.className = 'contact-item';
                d.innerText = "👤 " + name;
                d.onclick = () => selectChat(name);
                b.appendChild(d);
            });
        });
    }

    function selectChat(name) {
        partner = name;
        document.getElementById('chat-title').innerText = "Чат с: " + name;
        document.getElementById('chat-tools').style.display = 'flex';
        document.getElementById('m-inp').disabled = false;
        
        const chatID = [myName, partner].sort().join("_");
        if(currentChatRef) currentChatRef.off();
        currentChatRef = db.ref(`chats/${chatID}`);
        
        currentChatRef.on('value', snap => {
            const box = document.getElementById('messages');
            box.innerHTML = ''; // ПОЛНАЯ ОЧИСТКА ПЕРЕД ОТРИСОВКОЙ
            snap.forEach(c => {
                const m = c.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === myName ? 'mine' : 'others'}`;
                
                if(m.text) div.innerText = m.text;
                else if(m.audio) div.innerHTML = `<audio controls src="${m.audio}" style="width:200px; height:40px;"></audio>`;
                
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendMsg(e) {
        e.preventDefault();
        const i = document.getElementById('m-inp');
        if(!i.value || !partner) return;
        db.ref(`chats/${[myName, partner].sort().join("_")}`).push({from:myName, text:i.value, time:Date.now()});
        i.value = '';
    }

    async function toggleVoice() {
        const btn = document.getElementById('voice-btn');
        if (!mediaRec) {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(s);
                audioCh = [];
                mediaRec.ondataavailable = e => audioCh.push(e.data);
                mediaRec.onstop = () => {
                    const r = new FileReader();
                    r.readAsDataURL(new Blob(audioCh, { type: 'audio/webm' }));
                    r.onloadend = () => {
                        db.ref(`chats/${[myName, partner].sort().join("_")}`).push({from: myName, audio: r.result, time: Date.now()});
                    };
                    s.getTracks().forEach(t => t.stop());
                    mediaRec = null;
                };
                mediaRec.start();
                btn.innerText = '🛑'; btn.style.color = 'red';
            } catch (e) { alert("Микрофон недоступен"); }
        } else {
            mediaRec.stop();
            btn.innerText = '🎤'; btn.style.color = 'white';
        }
    }
</script>
</body>
</html>
