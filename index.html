<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loomi Ultimate Pro 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --green: #00a884; --bg: #0b141a; --dark: #111b21; 
            --panel: #202c33; --my-msg: #005c4b; --others-msg: #202c33; 
            --accent: #e1b12c; --blue-tick: #53bdeb; --text: #e9edef;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; display: flex; }

        /* AUTH SCREEN */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle, #111b21 0%, #000 100%); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--dark); padding: 40px; border-radius: 30px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* SIDEBAR */
        .sidebar { width: 380px; background: var(--dark); border-right: 1px solid #222; display: flex; flex-direction: column; transition: 0.3s; flex-shrink: 0; }
        .sidebar.hidden { transform: translateX(-100%); }
        
        @media (max-width: 850px) {
            .sidebar { position: absolute; width: 100%; height: 100%; z-index: 500; }
        }

        .header { background: var(--panel); padding: 15px 20px; display: flex; align-items: center; gap: 12px; min-height: 65px; }
        .search-box { padding: 10px 15px; }
        .search-inp { width: 100%; background: #2a3942; border: none; padding: 10px; border-radius: 10px; color: white; outline: none; }

        /* CONTACTS */
        .contact-item { padding: 12px 20px; border-bottom: 1px solid #1c262d; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; position: relative; }
        .contact-item:hover { background: #182229; }
        .contact-item.active { background: #2a3942; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #4f5e67; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .online-dot { width: 12px; height: 12px; border-radius: 50%; background: #444; border: 2px solid var(--dark); position: absolute; bottom: 12px; left: 50px; }
        .online-dot.online { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .online-dot.is-group { background: var(--accent); }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: var(--bg); position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }

        /* MESSAGES */
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 75%; font-size: 15.5px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .msg.mine { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--others-msg); border-top-left-radius: 2px; }
        .msg .author { font-size: 11px; color: var(--accent); font-weight: bold; display: block; margin-bottom: 2px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .msg audio { height: 35px; margin-top: 5px; filter: invert(0.8); }

        /* TICKS (Status) */
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }
        .ticks { font-size: 14px; line-height: 1; }
        .ticks.read { color: var(--blue-tick); }

        /* FOOTER */
        .footer { background: var(--panel); padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .inp-main { flex: 1; background: #2a3942; border: none; padding: 12px 18px; border-radius: 25px; color: white; outline: none; font-size: 16px; }
        .action-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #8696a0; transition: 0.2s; }
        .action-btn:hover { color: white; transform: scale(1.1); }

        .del-chat { color: #ff4b4b; margin-left: auto; padding: 5px; opacity: 0.3; transition: 0.3s; }
        .del-chat:hover { opacity: 1; }
    </style>
</head>
<body>

<audio id="notif-sound" src="https://www.soundjay.com/buttons/beep-07a.mp3"></audio>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--green)">Loomi</h1>
        <input type="text" id="a-name" class="inp-main" style="width:100%; margin-top:20px;" placeholder="Логин">
        <input type="password" id="a-pass" class="inp-main" style="width:100%; margin-top:10px;" placeholder="Пароль">
        <button onclick="login()" style="width:100%; padding:15px; background:var(--green); border:none; border-radius:30px; color:white; font-weight:bold; margin-top:20px; cursor:pointer;">ВОЙТИ</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="header">
        <div class="avatar" id="my-ava">?</div>
        <b id="my-name-display">Профиль</b>
        <button onclick="logout()" style="margin-left:auto; background:none; border:none; color:var(--accent); cursor:pointer;">Выход</button>
    </div>
    <div class="search-box">
        <input type="text" class="search-inp" placeholder="Поиск или новый чат..." oninput="filterContacts(this.value)">
    </div>
    <div style="padding: 0 15px 10px; display:flex; gap:5px;">
        <button onclick="addChat(false)" class="inp-main" style="font-size:11px; background:var(--green); cursor:pointer; flex:1;">+ ЧАТ</button>
        <button onclick="addChat(true)" class="inp-main" style="font-size:11px; background:var(--accent); cursor:pointer; flex:1;">+ ГРУППА</button>
    </div>
    <div id="contactsList" style="flex:1; overflow-y:auto;"></div>
</div>

<div class="chat-area">
    <div class="header" id="chat-header" style="display:none;">
        <button onclick="toggleSidebar()" id="back-btn" style="display:none;" class="action-btn">←</button>
        <div class="avatar" id="partner-ava">?</div>
        <div style="flex:1">
            <div id="partner-name" style="font-weight:bold;">Чат</div>
            <div id="status-text" style="font-size:12px; color:var(--green); height:14px;"></div>
        </div>
        <button id="group-add-btn" style="display:none;" onclick="inviteToGroup()" class="action-btn">👤+</button>
    </div>

    <div id="messages">
        <div style="margin:auto; text-align:center; opacity:0.5;">
            <h2>Loomi 2026</h2>
            <p>Выберите диалог для начала</p>
        </div>
    </div>

    <form class="footer" onsubmit="handleSend(event)">
        <label class="action-btn">➕<input type="file" id="f-picker" hidden onchange="uploadFile()"></label>
        <button type="button" id="mic-btn" class="action-btn" onclick="toggleVoice()">🎤</button>
        <input type="text" id="m-inp" class="inp-main" placeholder="Сообщение" disabled oninput="handleTyping()">
        <button type="submit" class="action-btn" style="color:var(--green)">🚀</button>
    </form>
</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const firebaseConfig = {
        apiKey: "AIzaSyA9DEtNqidbnYgWzI6FbYguI_V31Jx70PM",
        databaseURL: "https://loomi-48757-default-rtdb.firebaseio.com",
        projectId: "loomi-48757",
        appId: "1:332015550824:web:5b7e5c9aafa1e7703e16dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName, partner, isGroup, msgCount = 0, mediaRec, audioChunks = [], tTimeout;

    // --- АВТОРИЗАЦИЯ ---
    async function login() {
        const name = document.getElementById('a-name').value.trim().toLowerCase();
        const pass = document.getElementById('a-pass').value.trim();
        if(!name || !pass) return;

        const snap = await db.ref(`users/${name}`).once('value');
        if(snap.exists() && snap.val().pass !== pass) return alert("Неверный пароль");
        if(!snap.exists()) await db.ref(`users/${name}`).set({pass});

        myName = name;
        localStorage.setItem('loomi_2026_auth', JSON.stringify({name, pass}));
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name-display').innerText = name.toUpperCase();
        document.getElementById('my-ava').innerText = name[0].toUpperCase();
        
        db.ref(`status/${myName}`).set(true);
        db.ref(`status/${myName}`).onDisconnect().remove();
        
        if (Notification.permission !== "granted") Notification.requestPermission();
        initContacts();
    }

    // --- КОНТАКТЫ ---
    function initContacts() {
        db.ref(`users/${myName}/chats`).on('value', snap => {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            snap.forEach(child => {
                const name = child.key;
                const data = child.val();
                const div = document.createElement('div');
                div.className = `contact-item ${partner === name ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="avatar">${name[0].toUpperCase()}</div>
                    <div id="dot-${name}" class="online-dot ${data.isGroup ? 'is-group' : ''}"></div>
                    <div style="flex:1"><b>${name.toUpperCase()}</b></div>
                    <div class="del-chat" onclick="deleteChat('${name}', event)">🗑️</div>
                `;
                div.onclick = () => openChat(name, !!data.isGroup);
                list.appendChild(div);

                if(!data.isGroup) {
                    db.ref(`status/${name}`).on('value', s => {
                        const d = document.getElementById(`dot-${name}`);
                        if(d) d.classList.toggle('online', s.exists());
                    });
                }
            });
        });
    }

    // --- ЧАТ ---
    function openChat(name, groupFlag) {
        partner = name; isGroup = groupFlag; msgCount = 0;
        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('partner-name').innerText = isGroup ? `👥 ${name}` : name.toUpperCase();
        document.getElementById('partner-ava').innerText = name[0].toUpperCase();
        document.getElementById('m-inp').disabled = false;
        document.getElementById('group-add-btn').style.display = isGroup ? 'block' : 'none';
        
        if(window.innerWidth < 850) toggleSidebar();

        const chatId = isGroup ? `group_${name}` : [myName, name].sort().join('_');
        
        db.ref(`messages/${chatId}`).off();
        db.ref(`messages/${chatId}`).on('value', snap => {
            const box = document.getElementById('messages');
            
            // Уведомления и звук
            if(snap.numChildren() > msgCount) {
                const all = Object.values(snap.val() || {});
                const last = all[all.length - 1];
                if(last && last.from !== myName) {
                    document.getElementById('notif-sound').play().catch(()=>{});
                    if(document.hidden) new Notification(name, { body: last.text || "Вложение..." });
                }
            }
            msgCount = snap.numChildren();
            box.innerHTML = '';

            snap.forEach(mSnap => {
                const m = mSnap.val();
                
                // Система "Прочитано"
                if(m.from === partner && !m.seen) {
                    db.ref(`messages/${chatId}/${mSnap.key}`).update({seen: true});
                }

                const d = document.createElement('div');
                d.className = `msg ${m.from === myName ? 'mine' : 'others'}`;
                
                let html = (isGroup && m.from !== myName) ? `<span class="author">@${m.from}</span>` : '';
                
                if(m.file) {
                    if(m.type.startsWith('image/')) html += `<img src="${m.file}" onclick="window.open(this.src)">`;
                    else if(m.type.startsWith('audio/')) html += `<audio controls src="${m.file}"></audio>`;
                    else html += `<a href="${m.file}" download="${m.fileName}" style="color:white;text-decoration:none;">📄 ${m.fileName}</a>`;
                } else {
                    html += `<span>${m.text}</span>`;
                }

                const time = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const ticks = m.from === myName ? `<span class="ticks ${m.seen ? 'read' : ''}">${m.seen ? '✓✓' : '✓'}</span>` : '';
                
                html += `<div class="msg-meta">${time} ${ticks}</div>`;
                
                d.innerHTML = html;
                d.oncontextmenu = (e) => { e.preventDefault(); if(confirm("Удалить сообщение?")) db.ref(`messages/${chatId}/${mSnap.key}`).remove(); };
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        });

        if(!isGroup) {
            db.ref(`typing/${partner}/${myName}`).on('value', s => {
                document.getElementById('status-text').innerText = s.val() ? 'печатает...' : '';
            });
        }
    }

    // --- ФУНКЦИИ ОТПРАВКИ ---
    function handleSend(e) {
        e.preventDefault();
        const inp = document.getElementById('m-inp');
        if(!inp.value.trim()) return;
        const chatId = isGroup ? `group_${partner}` : [myName, partner].sort().join('_');
        db.ref(`messages/${chatId}`).push({
            from: myName, 
            text: inp.value, 
            time: Date.now(), 
            seen: false 
        });
        inp.value = '';
    }

    function uploadFile() {
        const file = document.getElementById('f-picker').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const chatId = isGroup ? `group_${partner}` : [myName, partner].sort().join('_');
            db.ref(`messages/${chatId}`).push({
                from: myName, 
                file: e.target.result, 
                fileName: file.name, 
                type: file.type, 
                time: Date.now(), 
                seen: false
            });
        };
        reader.readAsDataURL(file);
    }

    async function toggleVoice() {
        const btn = document.getElementById('mic-btn');
        if(!mediaRec) {
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRec = new MediaRecorder(s); audioChunks = [];
            mediaRec.ondataavailable = e => audioChunks.push(e.data);
            mediaRec.onstop = () => {
                const r = new FileReader();
                r.readAsDataURL(new Blob(audioChunks, {type:'audio/webm'}));
                r.onloadend = () => {
                    const chatId = isGroup ? `group_${partner}` : [myName, partner].sort().join('_');
                    db.ref(`messages/${chatId}`).push({ from: myName, file: r.result, type: 'audio/webm', time: Date.now(), seen: false });
                };
            };
            mediaRec.start(); btn.innerText = '🛑'; btn.style.color = 'red';
        } else {
            mediaRec.stop(); btn.innerText = '🎤'; btn.style.color = '#8696a0'; mediaRec = null;
        }
    }

    function handleTyping() {
        if(isGroup) return;
        db.ref(`typing/${myName}/${partner}`).set(true);
        clearTimeout(tTimeout);
        tTimeout = setTimeout(() => db.ref(`typing/${myName}/${partner}`).set(false), 2000);
    }

    // --- УПРАВЛЕНИЕ ---
    function addChat(group) {
        const n = prompt(group ? "Название группы:" : "Логин собеседника:");
        if(n) db.ref(`users/${myName}/chats/${n.toLowerCase()}`).set({isGroup: group});
    }

    function inviteToGroup() {
        const u = prompt("Введите логин участника:");
        if(u) db.ref(`users/${u.toLowerCase()}/chats/${partner}`).set({isGroup: true}).then(() => alert("Добавлен!"));
    }

    function deleteChat(name, e) {
        e.stopPropagation();
        if(confirm(`Удалить чат ${name}?`)) {
            db.ref(`users/${myName}/chats/${name}`).remove();
            if(partner === name) {
                partner = null;
                document.getElementById('messages').innerHTML = '';
                document.getElementById('chat-header').style.display = 'none';
            }
        }
    }

    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('hidden'); 
        document.getElementById('back-btn').style.display = document.getElementById('sidebar').classList.contains('hidden') ? 'block' : 'none';
    }

    function logout() { 
        db.ref(`status/${myName}`).remove(); 
        localStorage.clear(); 
        location.reload(); 
    }

    function filterContacts(v) {
        const items = document.querySelectorAll('.contact-item');
        items.forEach(i => i.style.display = i.innerText.toLowerCase().includes(v.toLowerCase()) ? 'flex' : 'none');
    }

    window.onload = () => {
        const auth = localStorage.getItem('loomi_2026_auth');
        if(auth) {
            const d = JSON.parse(auth);
            document.getElementById('a-name').value = d.name;
            document.getElementById('a-pass').value = d.pass;
            login();
        }
    };
</script>
</body>
</html>
